<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Winflex · Mantenimiento</title>
<meta name="description" content="Gastos de mantenimiento y proyectos de planta.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#127a4a">
<link rel="icon" href="favicon.png" sizes="64x64" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mantenimiento">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
/* MODO CELULAR: solo telefonos (tactil + lado menor < 600px). Tablet y PC no cambian. */
(function(){try{
  var p=new URLSearchParams(location.search).get('vista');
  if(p==='celu'||p==='full')localStorage.setItem('wf_vista',p);
  if(p==='auto')localStorage.removeItem('wf_vista');
  var pref=localStorage.getItem('wf_vista');
  var lado=Math.min(screen.width||9999,screen.height||9999);
  var tactil=(navigator.maxTouchPoints>0)||(window.matchMedia&&matchMedia('(pointer:coarse)').matches);
  if(pref==='celu'||(tactil&&lado<600&&pref!=='full'))document.documentElement.classList.add('celu');
}catch(e){}})();
</script>
<style>
:root{
  --verde:#1f9d63; --verde-osc:#127a4a; --verde-cl:#eef7f2; --verde-b:#cfe7db;
  --naranja:#d9793a; --naranja-cl:#fbf2ea; --rojo:#b4574c; --rojo-cl:#faefed; --azul:#2b7bb9; --azul-cl:#eaf2f9;
  --tinta:#28352f; --gris2:#42544c; --bg:#eaf0ed; --panel:#fff; --line:#e5ebe8; --line2:#f0f4f2; --gris:#7b8b83;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --sans:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,sans-serif;
  --disp:'Archivo','IBM Plex Sans',sans-serif;
  --sh:0 1px 2px rgba(40,53,47,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--tinta);font-size:14px;line-height:1.5;padding-bottom:64px}
.lbl{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--gris)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.hidden{display:none!important}
.mini{font-size:11.5px;color:var(--gris)}
:focus-visible{outline:2px solid var(--verde);outline-offset:2px}

/* header */
header{background:var(--panel);border-bottom:3px solid var(--verde-osc);padding:12px 20px;display:flex;flex-wrap:wrap;
  gap:14px;align-items:center;position:sticky;top:0;z-index:30;box-shadow:0 2px 8px rgba(40,53,47,.06)}
.logo{display:flex;align-items:center;gap:10px}
.logo img.mk{height:31px;width:auto;display:block}
.logo img.wm{height:20px;width:auto;display:block;margin-left:-2px}
.logo .sub{font-size:12.5px;font-weight:500;color:var(--gris);padding-left:13px;margin-left:4px;border-left:1px solid var(--line)}
.spacer{flex:1}
header button,.tbtn{font-family:var(--sans);font-size:13px;font-weight:500;border-radius:8px;border:1px solid var(--line);
  background:var(--panel);color:var(--gris2);padding:8px 12px;cursor:pointer}
header button:hover,.tbtn:hover{border-color:var(--verde-b);color:var(--verde-osc)}
.sync{font-size:11.5px;font-weight:600;border-radius:999px;padding:6px 12px;display:inline-flex;align-items:center;gap:7px}
.sync::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.sync.ok{color:var(--verde-osc);background:var(--verde-cl)} .sync.wait{color:#9c5420;background:var(--naranja-cl)}
.sync.err{color:#8e3b32;background:var(--rojo-cl)} .sync.off{color:var(--gris);background:var(--line2)}
.whoami{font-family:var(--disp);font-size:12.5px;font-weight:600;color:var(--gris2);background:var(--line2);border-radius:999px;padding:6px 13px}
.aviso{background:var(--naranja-cl);border:1px solid #efd7c1;color:#9c5420;border-radius:11px;padding:11px 15px;font-size:12.5px;
  max-width:1200px;margin:14px auto 0;width:calc(100% - 40px);display:flex;gap:12px;align-items:center;flex-wrap:wrap}

/* tabs */
.nav-wrap{max-width:1240px;margin:16px auto 0;padding:0 20px;width:100%}
nav{display:flex;gap:4px;overflow-x:auto;background:#dde7e2;border-radius:12px;width:fit-content;max-width:100%}
nav button{font-family:var(--sans);font-size:13.5px;font-weight:600;background:transparent;border:0;border-radius:10px;
  color:var(--gris2);padding:9px 18px;cursor:pointer;white-space:nowrap;margin:4px}
nav button:hover{color:var(--verde-osc)}
nav button[aria-selected="true"]{background:var(--panel);color:var(--verde-osc);box-shadow:0 1px 3px rgba(40,53,47,.14)}
nav .pill{background:var(--naranja-cl);color:var(--naranja);border-radius:999px;padding:1px 7px;font-size:10.5px;margin-left:6px;font-family:var(--mono)}
main{padding:18px 20px;max-width:1240px;margin:0 auto;width:100%}

/* filtros */
.filtros{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:14px}
.filtros label{min-width:130px;flex:0 1 auto}
.filtros label.grow{flex:1 1 220px}
.seg{display:inline-flex;background:#dde7e2;border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--gris2);padding:7px 12px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--verde-osc);box-shadow:0 1px 3px rgba(40,53,47,.14)}

/* kpi */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px 16px;box-shadow:var(--sh)}
.kpi b{display:block;font-family:var(--mono);font-size:24px;font-weight:600;letter-spacing:-.035em;margin-top:6px}
.kpi small{display:block;font-size:12px;color:var(--gris);margin-top:2px}
.kpi.ok{background:var(--verde-cl);border-color:var(--verde-b);border-left:4px solid var(--verde)} .kpi.ok b{color:var(--verde-osc)}
.kpi.warn{background:var(--naranja-cl);border-color:#e6bf9c;border-left:4px solid var(--naranja)} .kpi.warn b{color:#8c4a1c}
.kpi.bad{background:var(--rojo-cl);border-color:#e5b8b1;border-left:4px solid var(--rojo)} .kpi.bad b{color:#82322a}
.kpi.dark{background:var(--verde-osc);border-color:var(--verde-osc)} .kpi.dark .lbl,.kpi.dark small{color:rgba(255,255,255,.8)} .kpi.dark b{color:#fff}
.up{color:var(--rojo);font-weight:600} .down{color:var(--verde-osc);font-weight:600}

/* cards / grid */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
.card h2{font-family:var(--disp);font-size:14.5px;font-weight:600;margin-bottom:13px;display:flex;align-items:center;gap:10px}
.card h2 .r{margin-left:auto;font-family:var(--sans);font-size:12px;font-weight:500;color:var(--gris)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.g2>.card{margin-bottom:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.grid .full{grid-column:1/-1}
h3.sec{font-family:var(--disp);font-size:12px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--gris2);
  background:#dde7e2;border-radius:9px;padding:10px 16px;margin:24px 0 12px;display:flex;align-items:center;gap:10px}
h3.sec:first-child{margin-top:0}
h3.sec span{font-family:var(--mono);background:rgba(255,255,255,.8);border-radius:999px;padding:2px 9px}

/* forms */
label{display:block} label .lbl{display:block;margin-bottom:4px}
input,select,textarea{width:100%;font-family:var(--sans);font-size:13.5px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--tinta)}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--verde);outline:none}
input.num{font-family:var(--mono)}
input[readonly]{background:var(--line2)}
.btn{font-family:var(--sans);font-size:13.5px;font-weight:600;padding:10px 20px;border-radius:9px;border:1px solid var(--verde);
  background:var(--verde);color:#fff;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{background:var(--verde-osc);border-color:var(--verde-osc)}
.btn.ghost{background:#fff;color:var(--verde-osc)} .btn.ghost:hover{background:var(--verde-cl)}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn.danger{border-color:var(--line);background:#fff;color:var(--rojo)} .btn.danger:hover{background:var(--rojo-cl);border-color:var(--rojo)}
.row-actions{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row-actions .spacer{flex:1}

/* tablas */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#fff;padding:9px 10px;background:var(--verde-osc);white-space:nowrap}
th:first-child{border-radius:8px 0 0 0} th:last-child{border-radius:0 8px 0 0}
td{padding:7px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
tbody tr:nth-child(even) td{background:#f7faf8}
tbody tr.clk{cursor:pointer} tbody tr.clk:hover td{background:var(--verde-cl)}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.sum td{font-weight:700;background:var(--line2)!important;border-top:2px solid var(--verde-b)}
td .det{display:block;font-size:11.5px;color:var(--gris);margin-top:1px}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--line2);color:var(--gris2);white-space:nowrap}
.tag.COR{background:var(--rojo-cl);color:var(--rojo)} .tag.PRE{background:var(--verde-cl);color:var(--verde-osc)}
.tag.MEJ{background:var(--azul-cl);color:var(--azul)} .tag.PRY{background:#f1ecf8;color:#6b4fa0}
.tag.warn{background:var(--naranja-cl);color:#9c5420}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:7px;vertical-align:0}

/* barras horizontales */
.hb{display:grid;grid-template-columns:minmax(110px,190px) 1fr auto;gap:6px 12px;align-items:center;font-size:12.5px}
.hb .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--gris2)}
.hb .t.clk{cursor:pointer} .hb .t.clk:hover{color:var(--verde-osc);text-decoration:underline}
.hb .b{height:14px;background:var(--line2);border-radius:4px;overflow:hidden}
.hb .b i{display:block;height:100%;border-radius:4px;background:var(--verde)}
.hb .v{font-family:var(--mono);font-size:12px;text-align:right;white-space:nowrap}
.hb .v small{color:var(--gris);margin-left:6px}
svg text{font-family:var(--sans)}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:var(--gris2);margin-top:8px}

/* proyectos */
.board{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:#dde7e2;border-radius:12px;padding:10px;min-height:120px}
.col>h4{font-family:var(--disp);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gris2);margin:2px 4px 10px;display:flex;justify-content:space-between}
.pc{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--verde);border-radius:6px 11px 11px 6px;padding:11px 12px;margin-bottom:9px;cursor:pointer;box-shadow:0 1px 3px rgba(40,53,47,.07)}
.pc:hover{border-color:var(--verde-b)}
.pc.P1{border-left-color:var(--rojo)} .pc.P2{border-left-color:var(--naranja)} .pc.P3{border-left-color:var(--verde)}
.pc b{font-family:var(--disp);font-size:13.5px;display:block;line-height:1.3}
.pc .m{font-size:11.5px;color:var(--gris);margin-top:3px}
.prog{height:7px;background:var(--line2);border-radius:99px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--verde);border-radius:99px}
.prog.over i{background:var(--rojo)}
.pc .r2{display:flex;justify-content:space-between;font-size:11px;color:var(--gris2);margin-top:5px;font-family:var(--mono)}
.ptop{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.ptop h1{font-family:var(--disp);font-size:22px;letter-spacing:-.02em;line-height:1.2}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.subtabs button{border:0;background:transparent;font-family:var(--sans);font-size:13px;font-weight:600;color:var(--gris);padding:10px 14px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.subtabs button[aria-selected="true"]{color:var(--verde-osc);border-bottom-color:var(--verde-osc)}
.etapa{border:1px solid var(--line);border-radius:11px;margin-bottom:10px;overflow:hidden}
.etapa-h{display:flex;gap:12px;align-items:center;padding:11px 14px;background:#fafcfb;flex-wrap:wrap}
.etapa-h b{font-family:var(--disp);font-size:14px}
.etapa-b{padding:10px 14px;border-top:1px solid var(--line2)}
.chk{display:flex;gap:10px;align-items:center;padding:5px 0;font-size:13px}
.chk input{width:18px;height:18px;flex:none;accent-color:var(--verde)}
.chk.ok span{text-decoration:line-through;color:var(--gris)}
.chk .x{margin-left:auto;border:0;background:none;color:var(--gris);cursor:pointer;font-size:16px}
.chk .x:hover{color:var(--rojo)}
.addrow{display:flex;gap:8px;margin-top:8px} .addrow input{flex:1}
.bit{border-left:3px solid var(--verde-b);padding:6px 0 6px 14px;margin-bottom:8px}
.bit .mini b{color:var(--gris2)}
.est{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 10px;border-radius:999px}
.est.IDE,.est.EVA{background:var(--line2);color:var(--gris2)} .est.APR{background:var(--azul-cl);color:var(--azul)}
.est.EJE{background:var(--naranja-cl);color:#9c5420} .est.PEM{background:#f1ecf8;color:#6b4fa0}
.est.CER{background:var(--verde-cl);color:var(--verde-osc)} .est.SUS{background:var(--rojo-cl);color:var(--rojo)}
.est.pend{background:var(--line2);color:var(--gris2)} .est.curso{background:var(--naranja-cl);color:#9c5420} .est.hecha{background:var(--verde-cl);color:var(--verde-osc)}

/* modal / login / toast */
.ovl{position:fixed;inset:0;background:rgba(21,37,29,.42);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto}
.ovl:empty{display:none}
.modal{position:relative;background:var(--panel);border-radius:16px;max-width:820px;width:100%;padding:22px;box-shadow:0 18px 50px rgba(21,37,29,.28)}
.modal.w{max-width:1000px}
.modal h2{font-family:var(--disp);font-size:17px;font-weight:600;margin-bottom:4px;padding-right:40px}
.modal .sub{font-size:12.5px;color:var(--gris);margin-bottom:16px}
.cerrar{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--gris2);font-size:19px;line-height:1;cursor:pointer}
.cerrar:hover{border-color:var(--rojo);color:var(--rojo);background:var(--rojo-cl)}
.login{position:fixed;inset:0;background:linear-gradient(160deg,#f3f7f4,#e2ede7);z-index:100;display:flex;align-items:center;justify-content:center;padding:22px}
.login.off{display:none}
.login-box{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:34px 30px;width:100%;max-width:390px;text-align:center;box-shadow:0 20px 50px rgba(21,45,33,.14)}
.login-box .mk{height:52px;margin-bottom:9px} .login-box .wm{height:26px;margin-bottom:20px}
.login-t{font-family:var(--disp);font-size:19px;font-weight:700}
.login-s{font-size:13px;color:var(--gris);margin:5px 0 18px}
#lg-in{font-family:var(--mono);font-size:26px;text-align:center;letter-spacing:.4em;padding:13px;border-radius:11px}
.login-err{color:var(--rojo);font-size:12.5px;height:17px;margin:8px 0 4px;font-weight:600}
.empty{text-align:center;color:var(--gris);padding:40px 18px;font-size:13.5px;background:var(--panel);border:1px dashed var(--line);border-radius:14px}
.empty b{display:block;color:var(--tinta);margin-bottom:6px;font-size:15px;font-family:var(--disp)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(90px);background:var(--tinta);color:#fff;padding:12px 22px;border-radius:999px;font-size:13px;font-weight:600;transition:transform .3s;z-index:90;box-shadow:0 8px 24px rgba(21,37,29,.26)}
.toast.show{transform:translateX(-50%) translateY(0)}
body.ro .solo-carga,body.ro .solo-admin{display:none!important}
body.carga .solo-admin{display:none!important}
.fab{display:none}
@media(max-width:760px){
  main,.nav-wrap{padding-left:12px;padding-right:12px} header{padding:10px 12px;gap:8px}
  .logo img.wm,#whoami,#btnCsv,#btnExp,#btnImp{display:none}
  .board{grid-template-columns:repeat(5,250px)} .g2{grid-template-columns:1fr}
  .hb{grid-template-columns:110px 1fr auto}
  .hide-m{display:none}
  header{flex-wrap:nowrap} header .sync{font-size:11px;padding:5px 9px;max-width:150px;overflow:hidden;white-space:nowrap}
  .kpis{grid-template-columns:1fr 1fr!important;gap:9px} .kpi{padding:11px 12px} .kpi b{font-size:18px}
  .fab{display:flex;position:fixed;right:16px;bottom:18px;width:58px;height:58px;border-radius:50%;background:var(--verde);color:#fff;font-size:30px;border:0;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(18,122,74,.4);z-index:40}
  body.ro .fab{display:none}
}
html.celu input,html.celu select,html.celu textarea{font-size:16px}
@media print{header,nav,.nav-wrap,.filtros,.fab,.row-actions,.aviso{display:none!important} body{background:#fff}}
</style>
</head>
<body>

/* ---------------- utilidades ---------------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).slice(2,6).toUpperCase();
const AHORA=()=>Date.now();
const HOY=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10);};
const f0=n=>(n==null||isNaN(n))?'—':Math.round(n).toLocaleString('es-AR');
const f2=n=>(n==null||isNaN(n))?'—':Number(n).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fARS=n=>'$ '+f0(n);
const fUSD=n=>(n==null||isNaN(n))?'—':'U$D '+f0(n);
const fK=n=>{const a=Math.abs(n);return a>=1e6?(n/1e6).toLocaleString('es-AR',{maximumFractionDigits:1})+' M':a>=1e4?(n/1e3).toLocaleString('es-AR',{maximumFractionDigits:0})+' k':f0(n);};
const fFec=s=>s?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(2,4):'—';
const mesTxt=k=>MESES[+k.slice(5,7)-1]+' '+k.slice(2,4);
const pnum=v=>{if(v==null)return NaN;v=String(v).trim().replace(/\s|\$/g,'');if(/,\d{1,2}$/.test(v)||/\.\d{3}/.test(v))v=v.replace(/\./g,'').replace(',','.');return parseFloat(v);};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._i);t._i=setTimeout(()=>t.classList.remove('show'),2400);}

/* ---------------- tipo de cambio (oficial BNA venta) ---------------- */
let TCA=[];  /* [[fecha,venta],...] ordenado */
function cargarTCcache(){try{const c=JSON.parse(localStorage.getItem('wf_tc_oficial')||'null');if(c&&c.a)TCA=c.a;return c;}catch(e){return null;}}
async function bajarTC(){
  const c=cargarTCcache();
  if(c&&c.t&&(AHORA()-c.t)<6*3600e3) return;
  try{
    const r=await fetch('https://api.argentinadatos.com/v1/cotizaciones/dolares/oficial',{cache:'no-store'});
    if(!r.ok) throw 0;

function filtrarGastos(){
  const q=FG.q.trim().toLowerCase();
  return D.gastos.filter(g=>(!FG.anio||g.fec.startsWith(FG.anio))&&(!FG.mes||g.fec.slice(5,7)===FG.mes)&&(!FG.sec||g.sec===FG.sec)&&
    (!FG.eq||g.eq===FG.eq)&&(!FG.prov||provNorm(g.prov)===FG.prov)&&(!FG.tipo||(FG.tipo==='-'?!g.tipo:g.tipo===FG.tipo))&&
    (!FG.cat||(g.cat||'OTR')===FG.cat)&&(!FG.pago||(FG.pago==='-'?!g.pago:g.pago===FG.pago))&&(!FG.proy||g.proy===FG.proy)&&(!FG.pl||g.pl===FG.pl)&&
    (!q||[g.desc,g.det,g.prov,g.comp,eqNom(g),g.maq].join(' ').toLowerCase().includes(q)))
    .sort((a,b)=>a.fec===b.fec?(b.ts||0)-(a.ts||0):(a.fec<b.fec?1:-1));
}
function opts(obj,sel,vacio){return (vacio!=null?`<option value="">${vacio}</option>`:'')+Object.entries(obj).map(([k,v])=>`<option value="${esc(k)}"${k===sel?' selected':''}>${esc(v)}</option>`).join('');}

  ${gs.length>FG.lim?`<div style="text-align:center"><button class="btn ghost" id="gmas">Ver ${Math.min(200,gs.length-FG.lim)} más (${gs.length-FG.lim} restantes)</button></div>`:''}`;
  el.querySelectorAll('[data-g]').forEach(r=>r.onclick=()=>formGasto(r.dataset.g));

    const r={fec:$('#g-fec').value,pl:$('#g-pl').value,sec:$('#g-sec').value,eq:$('#g-eq').value||undefined,desc:$('#g-desc').value.trim(),
      det:$('#g-det').value.trim()||undefined,tipo:$('#g-tipo').value||undefined,cat:$('#g-cat').value||undefined,prov:$('#g-prov').value.trim(),
      comp:$('#g-comp').value.trim()||undefined,ars:pnum($('#g-ars').value)||0,pago:$('#g-pago').value||undefined,hp:pnum($('#g-hp').value)||undefined,
      resp:$('#g-resp').value.trim()||undefined,proy:$('#g-proy').value||undefined,et:($('#g-proy').value&&$('#g-et').value)||undefined};
    const tcm=pnum($('#g-tc').value), tcd=tcDia(r.fec); r.tc=tcm||(tcd?Math.round(tcd*100)/100:undefined);
    if(!r.fec||!r.sec||!r.desc||!(r.ars>0)){toast('Faltan fecha, sector, descripción o importe');return null;}
    if(!r.pago&&(!id||r.fec>='2025-01-01')){toast('Indicá si es B (facturado) o N (sin factura)');$('#g-pago').focus();return null;}
    return r;
  };
  const guardar=otro=>{const r=leer();if(!r)return;
    if(id){const fl=(g.fl||[]).filter(f=>!(f==='fecha'&&r.fec!==g.fec));Object.assign(g,r,{ts:AHORA(),fl:fl.length?fl:undefined});}
    else D.gastos.push(Object.assign({id:uid(),ts:AHORA(),user:USER.n},r));
    Object.keys(g).forEach(k=>g[k]===undefined&&delete g[k]);
    save(); toast(id?'Gasto actualizado':'Gasto cargado');
    if(otro)formGasto(null,{fec:r.fec,pl:r.pl,sec:r.sec,eq:r.eq,tipo:r.tipo,prov:r.prov,proy:r.proy,et:r.et});else cerrarModal();};
  const b=$('#g-ok');if(b)b.onclick=()=>guardar(false);
  const o=$('#g-otro');if(o)o.onclick=()=>guardar(true);
  const rv=$('#g-okrev');if(rv)rv.onclick=()=>{g.ok=1;g.ts=AHORA();save();cerrarModal();toast('Marcado como revisado');};
  const d=$('#g-del');if(d)d.onclick=()=>{if(!confirm('¿Eliminar este gasto?'))return;D.gastos=D.gastos.filter(x=>x.id!==id);borrar(id);save();cerrarModal();toast('Gasto eliminado');};
  if(!id)setTimeout(()=>$('#g-sec').focus(),50);
}

function bitAuto(p,t){p.bit=p.bit||[];p.bit.push({id:uid(),fec:HOY(),u:USER?USER.n:'',t,auto:1});}

function gantt(p){
  const et=(p.etapas||[]).filter(e=>e.fi&&e.ff); if(!et.length) return '<p class="mini">Cargá fechas de inicio y fin en las etapas para ver el cronograma.</p>';
  const ini=[p.fi,...et.map(e=>e.fi)].filter(Boolean).sort()[0], fin=[p.ff,...et.map(e=>e.ff)].filter(Boolean).sort().pop();
  const a=new Date(ini),b=new Date(fin);const dias=Math.max(1,(b-a)/864e5);
  const W=960,L=200,rh=30,H=et.length*rh+34;const x=f=>L+(W-L-10)*((new Date(f)-a)/864e5)/dias;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Cronograma">`;
  /* marcas de mes */
  let m=new Date(ini.slice(0,7)+'-01T12:00');while(m<=b){const f=m.toISOString().slice(0,10);if(f>=ini){s+=`<line x1="${x(f)}" x2="${x(f)}" y1="18" y2="${H}" stroke="#e5ebe8"/><text x="${x(f)+3}" y="12" font-size="10.5" fill="#7b8b83">${mesTxt(f)}</text>`;}m.setMonth(m.getMonth()+1);}
  et.forEach((e,i)=>{const y=24+i*rh;const c=e.est==='hecha'?'#1f9d63':e.est==='curso'?'#d9793a':'#9fb3a9';
    const late=e.ff<HOY()&&e.est!=='hecha';
    s+=`<text x="4" y="${y+15}" font-size="12" fill="#28352f">${esc(e.nom.length>28?e.nom.slice(0,27)+'…':e.nom)}</text>
      <rect x="${x(e.fi)}" y="${y+3}" width="${Math.max(4,x(e.ff)-x(e.fi))}" height="18" rx="5" fill="${c}" ${late?'stroke="#b4574c" stroke-width="2"':''}><title>${esc(e.nom)}: ${fFec(e.fi)} → ${fFec(e.ff)} · ${ESTE[e.est||'pend']}</title></rect>`;});
  const h=HOY();if(h>=ini&&h<=fin)s+=`<line x1="${x(h)}" x2="${x(h)}" y1="16" y2="${H}" stroke="#b4574c" stroke-width="2"/><text x="${x(h)+4}" y="${H-4}" font-size="10.5" fill="#b4574c">hoy</text>`;
  return s+'</svg>';
}

      :'<div class="empty"><b>Sin gastos vinculados</b>Los gastos que cargues con este proyecto aparecen acá y suman al ejecutado.</div>'}`;

    ${ed?`<select id="p-estq" class="tbtn" style="width:auto" title="Cambiar estado">${opts(ESTP,p.est)}</select><button class="btn ghost" id="p-edit">Editar ficha</button>`:''}
    <button class="tbtn" onclick="window.print()">Imprimir</button></div>
  <div class="subtabs">${Object.entries(tabs).map(([k,t])=>`<button data-pt="${k}" aria-selected="${k===PRY_TAB}">${t}</button>`).join('')}</div>${body}`;

  $('#p-volver').onclick=()=>{PRY_ABIERTO=null;render();};
  el.querySelectorAll('[data-pt]').forEach(b=>b.onclick=()=>{PRY_TAB=b.dataset.pt;rProyecto(p);});
  if(!ed){el.querySelectorAll('[data-g]').forEach(r=>r.onclick=()=>formGasto(r.dataset.g));return;}
  $('#p-edit').onclick=()=>formProyecto(p.id);
  $('#p-estq').onchange=e=>{const n=e.target.value;bitAuto(p,'Estado: '+ESTP[p.est]+' → '+ESTP[n]);p.est=n;if(n==='CER'&&!p.fcr)p.fcr=HOY();tocar(p);toast('Estado: '+ESTP[n]);};
  /* planificación */
  const nb=$('#et-nueva');if(nb)nb.onclick=()=>formEtapa(p);
  el.querySelectorAll('[data-eed]').forEach(b=>b.onclick=()=>formEtapa(p,b.dataset.eed));
  el.querySelectorAll('[data-eup]').forEach(b=>b.onclick=()=>{const i=+b.dataset.eup;if(!i)return;const a=p.etapas;[a[i-1],a[i]]=[a[i],a[i-1]];tocar(p);});
  const etDe=id=>p.etapas.find(x=>x.id===id);
  el.querySelectorAll('[data-it]').forEach(c=>c.onchange=()=>{const [e,i]=c.dataset.it.split('|');const et=etDe(e),it=et.items.find(x=>x.id===i);
    it.ok=c.checked;it.fec=c.checked?HOY():undefined;it.u=c.checked?USER.n:undefined;
    const n=et.items.filter(x=>x.ok).length;et.est=n===et.items.length?'hecha':n?'curso':(et.est==='hecha'?'curso':et.est);tocar(p);});
  el.querySelectorAll('[data-itdel]').forEach(b=>b.onclick=e=>{e.preventDefault();const [ei,i]=b.dataset.itdel.split('|');const et=etDe(ei);et.items=et.items.filter(x=>x.id!==i);tocar(p);});
  const addIt=eid=>{const inp=el.querySelector(`[data-itadd="${eid}"]`);const t=inp.value.trim();if(!t)return;const et=etDe(eid);et.items=et.items||[];et.items.push({id:uid(),t,ok:false});if(et.est==='hecha')et.est='curso';tocar(p);
    setTimeout(()=>{const x=document.querySelector(`[data-itadd="${eid}"]`);if(x)x.focus();},30);};
  el.querySelectorAll('[data-itaddb]').forEach(b=>b.onclick=()=>addIt(b.dataset.itaddb));
  el.querySelectorAll('[data-itadd]').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')addIt(i.dataset.itadd);});
  /* puesta en marcha */
  el.querySelectorAll('[data-pem]').forEach(c=>c.onchange=()=>{const it=p.pem.find(x=>x.id===c.dataset.pem);it.ok=c.checked;it.fec=c.checked?HOY():undefined;it.u=c.checked?USER.n:undefined;tocar(p);});
  el.querySelectorAll('[data-pemdel]').forEach(b=>b.onclick=e=>{e.preventDefault();p.pem=p.pem.filter(x=>x.id!==b.dataset.pemdel);tocar(p);});
  const pa=$('#pem-addb');if(pa){const f=()=>{const t=$('#pem-add').value.trim();if(!t)return;p.pem=p.pem||[];p.pem.push({id:uid(),t,ok:false});tocar(p);};pa.onclick=f;$('#pem-add').onkeydown=e=>{if(e.key==='Enter')f();};}
  const po=$('#pem-ok');if(po)po.onclick=()=>{p.pemf=$('#pem-f').value;p.pemr=$('#pem-r').value.trim();if(p.pemf&&p.est!=='CER'&&p.est!=='PEM'){bitAuto(p,'Estado: '+ESTP[p.est]+' → '+ESTP.PEM);p.est='PEM';}tocar(p);toast('Guardado');};
  /* seguimiento */
  const bo=$('#b-ok');if(bo)bo.onclick=()=>{const t=$('#b-t').value.trim();if(!t){toast('Escribí la novedad');return;}p.bit=p.bit||[];p.bit.push({id:uid(),fec:$('#b-f').value||HOY(),u:USER.n,t});tocar(p);toast('Agregado a la bitácora');};
  el.querySelectorAll('[data-bdel]').forEach(a=>a.onclick=e=>{e.preventDefault();if(!confirm('¿Borrar esta novedad?'))return;p.bit=p.bit.filter(x=>x.id!==a.dataset.bdel);tocar(p);});
  /* gastos */
  const pg=$('#pg-nuevo');if(pg)pg.onclick=()=>formGasto(null,{proy:p.id,tipo:'PRY',sec:p.sec||'',eq:p.eq||undefined,pl:p.pl||'L'});
  el.querySelectorAll('[data-g]').forEach(r=>r.onclick=()=>formGasto(r.dataset.g));
}
function formEtapa(p,eid){
  const et=eid?p.etapas.find(x=>x.id===eid):{est:'pend',resp:p.resp};
  abrirModal(`<h2>${eid?'Editar etapa':'Nueva etapa'}</h2><p class="sub">${esc(p.nom)}</p><div class="grid">
    <label class="full"><span class="lbl">Nombre *</span><input id="e-nom" value="${esc(et.nom||'')}" placeholder="Ej. Compra de repuestos"></label>
    <label><span class="lbl">Inicio</span><input type="date" id="e-fi" value="${esc(et.fi||'')}"></label>
    <label><span class="lbl">Fin</span><input type="date" id="e-ff" value="${esc(et.ff||'')}"></label>
    <label><span class="lbl">Presupuesto (${p.mon==='ARS'?'$':'U$D'})</span><input class="num" id="e-pres" inputmode="decimal" value="${et.pres?String(et.pres).replace('.',','):''}"></label>
    <label><span class="lbl">Responsable</span><input id="e-resp" value="${esc(et.resp||'')}"></label>
    <label><span class="lbl">Estado</span><select id="e-est">${opts(ESTE,et.est||'pend')}</select></label>
    ${eid?'':'<label class="full"><span class="lbl">Tareas (una por renglón)</span><textarea id="e-its" placeholder="Pedir cotización\nAprobar compra\nRecibir y controlar"></textarea></label>'}
  </div><div class="row-actions">${eid?'<button class="btn danger" id="e-del">Eliminar etapa</button>':''}<span class="spacer"></span><button class="btn" id="e-ok">Guardar</button></div>`);
  $('#e-ok').onclick=()=>{const nom=$('#e-nom').value.trim();if(!nom){toast('Poné un nombre');return;}
    const r={nom,fi:$('#e-fi').value,ff:$('#e-ff').value,pres:pnum($('#e-pres').value)||0,resp:$('#e-resp').value.trim(),est:$('#e-est').value};
    if(eid)Object.assign(et,r);else{p.etapas=p.etapas||[];p.etapas.push(Object.assign({id:uid(),items:$('#e-its').value.split('\n').map(t=>t.trim()).filter(Boolean).map(t=>({id:uid(),t,ok:false}))},r));}
    if(!p.fi||(r.fi&&r.fi<p.fi))p.fi=r.fi||p.fi; if(!p.ff||(r.ff&&r.ff>p.ff))p.ff=r.ff||p.ff;
    tocar(p);cerrarModal();};
  const d=$('#e-del');if(d)d.onclick=()=>{if(!confirm('¿Eliminar la etapa?'))return;p.etapas=p.etapas.filter(x=>x.id!==eid);D.gastos.forEach(g=>{if(g.et===eid){delete g.et;g.ts=AHORA();}});tocar(p);cerrarModal();};
}

/* =====================================================================
   EQUIPOS Y PROVEEDORES
   ===================================================================== */
function rEquipos(){
  const el=$('#v-eq');const h=HOY();const d=new Date(h);d.setMonth(d.getMonth()-12);const s12=d.toISOString().slice(0,10);
  const st={};D.gastos.forEach(g=>{if(!g.eq)return;const x=st[g.eq]=st[g.eq]||{t:0,a:0,n:0,u:'',hp:0};const v=usdDe(g)||0;x.t+=v;x.n++;if(g.fec>s12){x.a+=v;x.hp+=g.hp||0;}if(g.fec>x.u)x.u=g.fec;});
  const eqs=D.equipos.slice().sort((a,b)=>((st[b.id]||{}).a||0)-((st[a.id]||{}).a||0)||a.nom.localeCompare(b.nom));
  const pv={};D.gastos.forEach(g=>{const k=provNorm(g.prov);if(!k)return;const x=pv[k]=pv[k]||{a:0,t:0,n:0,u:'',sec:{}};const v=usdDe(g)||0;x.t+=v;x.n++;if(g.fec>s12)x.a+=v;if(g.fec>x.u)x.u=g.fec;x.sec[g.sec]=(x.sec[g.sec]||0)+1;});
  const pvs=Object.entries(pv).sort((a,b)=>b[1].a-a[1].a||b[1].t-a[1].t);
  el.innerHTML=`<h3 class="sec">Equipos <span>${eqs.length}</span>${puede()?'<button class="btn sm" id="eq-nuevo" style="margin-left:auto">+ Agregar equipo</button>':''}</h3>
  <div class="card" style="padding:0;overflow:hidden"><div class="tw"><table><thead><tr><th>Equipo</th><th>Sector</th><th class="hide-m">Planta</th><th class="hide-m">Cód.</th><th class="n">U$D 12 meses</th><th class="n hide-m">U$D histórico</th><th class="n hide-m">Gastos</th><th class="n hide-m">h parada 12m</th><th>Último</th></tr></thead><tbody>
  ${eqs.map(e=>{const x=st[e.id]||{t:0,a:0,n:0,u:'',hp:0};return `<tr class="clk" data-eq="${e.id}"><td><b style="font-family:var(--disp)">${esc(e.nom)}</b></td><td><i class="dot" style="background:${SEC_COL[e.sec]}"></i>${esc(SECTORES[e.sec]||'')}</td><td class="hide-m">${esc(PLANTAS[e.pl]||'')}</td><td class="hide-m num">${esc(e.cod||'')}</td>
    <td class="n">${f0(x.a)}</td><td class="n hide-m">${f0(x.t)}</td><td class="n hide-m">${x.n}</td><td class="n hide-m">${x.hp?f0(x.hp):'—'}</td><td class="num">${fFec(x.u)}</td></tr>`;}).join('')}</tbody></table></div></div>
  <h3 class="sec">Proveedores <span>${pvs.length}</span></h3>
  <div class="card" style="padding:0;overflow:hidden"><div class="tw"><table><thead><tr><th>Proveedor</th><th class="hide-m">Sector principal</th><th class="n">U$D 12 meses</th><th class="n hide-m">U$D histórico</th><th class="n">Compras</th><th>Última</th></tr></thead><tbody>
  ${pvs.slice(0,80).map(([k,x])=>{const sp=Object.entries(x.sec).sort((a,b)=>b[1]-a[1])[0];return `<tr class="clk" data-pv="${esc(k)}"><td>${esc(provNombre(k))}</td><td class="hide-m">${esc(SECTORES[sp[0]]||'')}</td><td class="n">${f0(x.a)}</td><td class="n hide-m">${f0(x.t)}</td><td class="n">${x.n}</td><td class="num">${fFec(x.u)}</td></tr>`;}).join('')}</tbody></table></div></div>
  <p class="mini">Mostrando los 80 proveedores con más gasto. Los nombres escritos distinto (mayúsculas, espacios, S.A./SRL) se agrupan solos.</p>`;
  el.querySelectorAll('[data-eq]').forEach(r=>r.onclick=()=>fichaEquipo(r.dataset.eq));
  el.querySelectorAll('[data-pv]').forEach(r=>r.onclick=()=>irGastos({prov:r.dataset.pv}));
  const n=$('#eq-nuevo');if(n)n.onclick=()=>formEquipo();
}
function fichaEquipo(id){
  const e=eqDe(id);const gs=D.gastos.filter(g=>g.eq===id).sort((a,b)=>a.fec<b.fec?1:-1);
  const pys=D.proyectos.filter(p=>p.eq===id);
  const porA={};gs.forEach(g=>{const y=g.fec.slice(0,4);porA[y]=(porA[y]||0)+(usdDe(g)||0);});
  abrirModal(`<h2>${esc(e.nom)}</h2><p class="sub">${esc(SECTORES[e.sec]||'')} · ${esc(PLANTAS[e.pl]||'')}${e.cod?' · código '+esc(e.cod):''}</p>
   <div class="kpis">${Object.entries(porA).sort().map(([y,v])=>`<div class="kpi"><span class="lbl">${y}</span><b>U$D ${f0(v)}</b></div>`).join('')}</div>
   ${pys.length?`<p class="lbl">Proyectos</p><p style="margin-bottom:12px">${pys.map(p=>`<span class="est ${p.est}">${esc(p.nom)}</span>`).join(' ')}</p>`:''}
   <div class="tw"><table><thead><tr><th>Fecha</th><th>Descripción</th><th>Proveedor</th><th class="n">Pesos</th><th class="n">U$D</th></tr></thead><tbody>
   ${gs.map(g=>`<tr><td class="num">${fFec(g.fec)}</td><td>${esc(g.desc)}${g.det?`<span class="det">${esc(g.det)}</span>`:''}</td><td>${esc(g.prov)}</td><td class="n">${fARS(g.ars)}</td><td class="n">${f0(usdDe(g))}</td></tr>`).join('')||'<tr><td colspan="5" class="mini">Sin gastos.</td></tr>'}</tbody></table></div>
   <div class="row-actions"><button class="btn ghost" id="fe-gas">Ver en Gastos</button>${puede()?'<button class="btn ghost" id="fe-ed">Editar equipo</button><span class="spacer"></span><button class="btn" id="fe-nuevo">+ Cargar gasto a este equipo</button>':''}</div>`,true);
  $('#fe-gas').onclick=()=>{cerrarModal();irGastos({eq:id});};
  const ed=$('#fe-ed');if(ed)ed.onclick=()=>formEquipo(id);
  const nn=$('#fe-nuevo');if(nn)nn.onclick=()=>formGasto(null,{eq:id,sec:e.sec,pl:e.pl});
}
function formEquipo(id){
  const e=id?eqDe(id):{sec:'TER',pl:'L'};
  abrirModal(`<h2>${id?'Editar equipo':'Nuevo equipo'}</h2><p class="sub">&nbsp;</p><div class="grid">
    <label class="full"><span class="lbl">Nombre *</span><input id="q-nom" value="${esc(e.nom||'')}"></label>
    <label><span class="lbl">Sector</span><select id="q-sec">${opts(SECTORES,e.sec)}</select></label>
    <label><span class="lbl">Planta</span><select id="q-pl">${opts(PLANTAS,e.pl)}</select></label>

    <div class="row-actions">${id&&esAdmin()?'<button class="btn danger" id="q-del">Eliminar</button>':''}<span class="spacer"></span><button class="btn" id="q-ok">Guardar</button></div>`);
  $('#q-ok').onclick=()=>{const nom=$('#q-nom').value.trim();if(!nom){toast('Poné un nombre');return;}
    const r={nom,sec:$('#q-sec').value,pl:$('#q-pl').value,cod:$('#q-cod').value.trim(),ts:AHORA()};
    if(id)Object.assign(e,r);else D.equipos.push(Object.assign({id:'e'+uid()},r));save();cerrarModal();toast('Equipo guardado');};
  const d=$('#q-del');if(d)d.onclick=()=>{const n=D.gastos.filter(g=>g.eq===id).length;
    if(!confirm(n?`Tiene ${n} gastos cargados: quedan sin equipo (con su sector). ¿Eliminar igual?`:'¿Eliminar el equipo?'))return;
    D.gastos.forEach(g=>{if(g.eq===id){delete g.eq;g.ts=AHORA();}});D.equipos=D.equipos.filter(x=>x.id!==id);borrar(id);save();cerrarModal();};
}

   A REVISAR
   ===================================================================== */
function rAlertas(){
  const el=$('#v-ale');
  const inc=D.gastos.filter(g=>incompleto(g).length&&!g.ok).sort((a,b)=>a.fec<b.fec?1:-1);
  const at=D.proyectos.filter(atrasado);
  const etl=[];D.proyectos.filter(p=>!['CER','SUS'].includes(p.est)).forEach(p=>(p.etapas||[]).forEach(e=>{if(e.ff&&e.ff<HOY()&&e.est!=='hecha')etl.push([p,e]);}));
  const sob=D.proyectos.filter(p=>{const pr=presEn(p,'USD');return pr&&ejecutado(p).usd>pr;});
  el.innerHTML=`
  <h3 class="sec">Proyectos atrasados <span>${at.length}</span></h3>${at.map(p=>`<div class="card clk" data-pry="${p.id}" style="cursor:pointer;border-left:4px solid var(--naranja)"><b>${esc(p.nom)}</b> <span class="est ${p.est}">${ESTP[p.est]}</span><p class="mini">Fin planificado ${fFec(p.ff)} · avance ${avanceFis(p)}% · ${esc(p.resp||'')}</p></div>`).join('')||'<p class="mini">Ninguno.</p>'}
  <h3 class="sec">Etapas vencidas sin terminar <span>${etl.length}</span></h3>${etl.map(([p,e])=>`<div class="card" data-pry="${p.id}" style="cursor:pointer"><b>${esc(e.nom)}</b> <span class="mini">— ${esc(p.nom)}</span><p class="mini">Fin ${fFec(e.ff)} · ${ESTE[e.est||'pend']}${e.resp?' · '+esc(e.resp):''}</p></div>`).join('')||'<p class="mini">Ninguna.</p>'}
  <h3 class="sec">Proyectos pasados de presupuesto <span>${sob.length}</span></h3>${sob.map(p=>{const e=ejecutado(p);return `<div class="card" data-pry="${p.id}" style="cursor:pointer;border-left:4px solid var(--rojo)"><b>${esc(p.nom)}</b><p class="mini">Ejecutado U$D ${f0(e.usd)} vs presupuesto U$D ${f0(presEn(p,'USD'))}</p></div>`;}).join('')||'<p class="mini">Ninguno.</p>'}
  <h3 class="sec">Gastos incompletos <span>${inc.length}</span></h3>
  ${inc.length?`<p class="mini" style="margin-bottom:8px">Gastos sin importe, descripción, proveedor o con fecha estimada (en la planilla figuraban con "-" o "S/D"). Abrilos para completar o marcalos como revisados.</p>
  <div class="card" style="padding:0;overflow:hidden"><div class="tw"><table><thead><tr><th>Fecha</th><th>Descripción</th><th>Proveedor</th><th class="n">Pesos</th><th>Falta</th></tr></thead><tbody>
  ${inc.map(g=>`<tr class="clk" data-g="${g.id}"><td class="num">${fFec(g.fec)}</td><td>${esc(g.desc||'—')}<span class="det">${esc(eqNom(g)||SECTORES[g.sec]||'')}</span></td><td>${esc(g.prov||'—')}</td><td class="n">${fARS(g.ars)}</td><td>${incompleto(g).map(x=>`<span class="tag warn">${x}</span>`).join(' ')}</td></tr>`).join('')}</tbody></table></div></div>`:'<p class="mini">Todo completo.</p>'}`;
  el.querySelectorAll('[data-pry]').forEach(x=>x.onclick=()=>{PRY_ABIERTO=x.dataset.pry;PRY_TAB='res';view='pry';render();});
  el.querySelectorAll('[data-g]').forEach(x=>x.onclick=()=>formGasto(x.dataset.g));
}

     <p class="lbl" style="margin-top:14px">TC manual por mes (pisa al oficial)</p>
     <div class="addrow"><input type="month" id="c-mes"><input class="num" id="c-val" placeholder="$ por U$D" inputmode="decimal"><button class="btn sm" id="c-tcm">Guardar</button></div>
     <p class="mini" style="margin-top:6px">${Object.entries(D.tcMan||{}).map(([k,v])=>`${mesTxt(k)}: $ ${f2(v)} <a href="#" data-tcdel="${k}">quitar</a>`).join(' · ')||'Ninguno.'}</p></div>
   <div class="card"><h2>Usuarios</h2><table><tbody>${USUARIOS.map(u=>`<tr><td>${esc(u.n)}</td><td>${{admin:'Administrador',carga:'Carga y edición',lectura:'Solo lectura'}[u.rol]}</td></tr>`).join('')}</tbody></table>
     <p class="mini" style="margin-top:8px">Los PIN se cambian en el código (constante USUARIOS). Carga y edición: gastos, proyectos y equipos; solo el administrador elimina gastos.</p></div>
   <div class="card"><h2>Respaldo</h2><p class="mini">Descargá toda la base en JSON o recuperala desde un respaldo (se fusiona con lo actual, no borra).</p>
     <div class="row-actions"><button class="btn ghost" id="c-exp">Descargar respaldo</button><button class="btn ghost" id="c-imp">Importar respaldo</button></div>
     <p class="mini" style="margin-top:10px">Winflex · Mantenimiento ${VERSION}</p></div></div>`;
  const b=(i,f)=>{const x=$('#'+i);if(x)x.onclick=f;};
  b('c-crear',crearBin);b('c-usar',usarBin);b('c-sync',()=>sincronizar());b('c-exp',exportar);b('c-imp',()=>$('#fileImp').click());
  b('c-tc',()=>{try{localStorage.removeItem('wf_tc_oficial');}catch(e){}bajarTC().then(()=>toast(TCA.length?'TC actualizado':'No se pudo bajar el TC'));});
  b('c-fijar',()=>{let n=0;D.gastos.forEach(g=>{if(g.ars&&!g.tc){const t=tcDia(g.fec);if(t){g.tc=Math.round(t*100)/100;g.ts=AHORA();n++;}}});save();toast(n+' gastos con TC fijado');});
  b('c-tcm',()=>{const m=$('#c-mes').value,v=pnum($('#c-val').value);if(!m||!v){toast('Elegí mes y valor');return;}D.tcMan[m]=v;save();});
  el.querySelectorAll('[data-tcdel]').forEach(a=>a.onclick=e=>{e.preventDefault();delete D.tcMan[a.dataset.tcdel];save();});
}

/* ---------------- exportar / importar ---------------- */
function bajarArchivo(nom,txt,tipo){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:tipo}));a.download=nom;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);}
function exportar(){bajarArchivo('mantenimiento-respaldo-'+HOY()+'.json',JSON.stringify(D),'application/json');}
$('#btnExp').onclick=exportar; $('#btnImp').onclick=()=>$('#fileImp').click();
$('#fileImp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);
  if(!x.gastos)throw 0;D=fusionar(D,x);save();toast('Respaldo importado');}catch(err){alert('El archivo no es un respaldo válido.');}};r.readAsText(f);e.target.value='';};
$('#btnCsv').onclick=()=>{
  const gs=view==='gas'?filtrarGastos():D.gastos.slice().sort((a,b)=>a.fec<b.fec?1:-1);
  const c=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';const n=v=>v==null||isNaN(v)?'':String(Math.round(v*100)/100).replace('.',',');
  const rows=[['Fecha','Planta','Sector','Equipo','Descripción','Detalle','Tipo','Categoría','Proveedor','Comprobante','B/N','Importe $','TC','U$D','Horas parada','Proyecto','Responsable']]
   .concat(gs.map(g=>[g.fec,PLANTAS[g.pl]||'',SECTORES[g.sec]||'',eqNom(g),g.desc,g.det,TIPOS[g.tipo]||'',CATS[g.cat]||'',g.prov,g.comp,g.pago?g.pago+' '+pagoTxt(g.pago):'',n(g.ars),n(tcDe(g)),n(usdDe(g)),g.hp||'',(pryDe(g.proy)||{}).nom||'',g.resp]));
  bajarArchivo('mantenimiento-gastos-'+HOY()+'.csv','﻿'+rows.map(r=>r.map((v,i)=>[11,12,13].includes(i)?v:c(v)).join(';')).join('\r\n'),'text/csv;charset=utf-8');
};

/* ---------------- arranque ---------------- */
iniciarDatos(); cargarTCcache(); window._loginPrev(); bajarTC();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
