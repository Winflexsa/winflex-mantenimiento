<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Winflex · Mantenimiento</title>
<meta name="description" content="Gastos de mantenimiento y proyectos de planta.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16a34a">
<link rel="icon" href="favicon.png" sizes="64x64" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mantenimiento">
<script>
/* MODO CELULAR: solo telefonos (tactil + lado menor < 600px). Tablet y PC no cambian. */
(function(){try{
  var p=new URLSearchParams(location.search).get('vista');
  if(p==='celu'||p==='full')localStorage.setItem('wf_vista',p);
  if(p==='auto')localStorage.removeItem('wf_vista');
  var pref=localStorage.getItem('wf_vista');
  var lado=Math.min(screen.width||9999,screen.height||9999);
  var tactil=(navigator.maxTouchPoints>0)||(window.matchMedia&&matchMedia('(pointer:coarse)').matches);
  if(pref==='celu'||(tactil&&lado<600&&pref!=='full'))document.documentElement.classList.add('celu');
}catch(e){}})();
</script>
<style>
:root{
  --verde:#1f9d63; --verde-osc:#127a4a; --verde-cl:#eef7f2; --verde-b:#cfe7db;
  --naranja:#d9793a; --naranja-cl:#fbf2ea; --rojo:#b4574c; --rojo-cl:#faefed; --azul:#2b7bb9; --azul-cl:#eaf2f9;
  --tinta:#28352f; --gris2:#42544c; --bg:#eaf0ed; --panel:#fff; --line:#e5ebe8; --line2:#f0f4f2; --gris:#7b8b83;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --sans:'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,sans-serif;
  --disp:'Archivo','IBM Plex Sans',sans-serif;
  --sh:0 1px 2px rgba(40,53,47,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--tinta);font-size:14px;line-height:1.5;padding-bottom:64px}
.lbl{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--gris)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.hidden{display:none!important}
.mini{font-size:11.5px;color:var(--gris)}
:focus-visible{outline:2px solid var(--verde);outline-offset:2px}

/* header */
header{background:var(--panel);border-bottom:3px solid var(--verde-osc);padding:12px 20px;display:flex;flex-wrap:wrap;
  gap:14px;align-items:center;position:sticky;top:0;z-index:30;box-shadow:0 2px 8px rgba(40,53,47,.06)}
.logo{display:flex;align-items:center;gap:10px}
.logo img.mk{height:31px;width:auto;display:block}
.logo img.wm{height:20px;width:auto;display:block;margin-left:-2px}
.logo .sub{font-size:12.5px;font-weight:500;color:var(--gris);padding-left:13px;margin-left:4px;border-left:1px solid var(--line)}
.spacer{flex:1}
header button,.tbtn{font-family:var(--sans);font-size:13px;font-weight:500;border-radius:8px;border:1px solid var(--line);
  background:var(--panel);color:var(--gris2);padding:8px 12px;cursor:pointer}
header button:hover,.tbtn:hover{border-color:var(--verde-b);color:var(--verde-osc)}
.sync{font-size:11.5px;font-weight:600;border-radius:999px;padding:6px 12px;display:inline-flex;align-items:center;gap:7px}
.sync::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.sync.ok{color:var(--verde-osc);background:var(--verde-cl)} .sync.wait{color:#9c5420;background:var(--naranja-cl)}
.sync.err{color:#8e3b32;background:var(--rojo-cl)} .sync.off{color:var(--gris);background:var(--line2)}
.whoami{font-family:var(--disp);font-size:12.5px;font-weight:600;color:var(--gris2);background:var(--line2);border-radius:999px;padding:6px 13px}
.aviso{background:var(--naranja-cl);border:1px solid #efd7c1;color:#9c5420;border-radius:11px;padding:11px 15px;font-size:12.5px;
  max-width:1200px;margin:14px auto 0;width:calc(100% - 40px);display:flex;gap:12px;align-items:center;flex-wrap:wrap}

/* tabs */
.nav-wrap{max-width:1240px;margin:16px auto 0;padding:0 20px;width:100%}
nav{display:flex;gap:4px;overflow-x:auto;background:#dde7e2;border-radius:12px;width:fit-content;max-width:100%}
nav button{font-family:var(--sans);font-size:13.5px;font-weight:600;background:transparent;border:0;border-radius:10px;
  color:var(--gris2);padding:9px 18px;cursor:pointer;white-space:nowrap;margin:4px}
nav button:hover{color:var(--verde-osc)}
nav button[aria-selected="true"]{background:var(--panel);color:var(--verde-osc);box-shadow:0 1px 3px rgba(40,53,47,.14)}
nav .pill{background:var(--naranja-cl);color:var(--naranja);border-radius:999px;padding:1px 7px;font-size:10.5px;margin-left:6px;font-family:var(--mono)}
main{padding:18px 20px;max-width:1240px;margin:0 auto;width:100%}

/* filtros */
.filtros{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:14px}
.filtros label{min-width:130px;flex:0 1 auto}
.filtros label.grow{flex:1 1 220px}
.seg{display:inline-flex;background:#dde7e2;border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--gris2);padding:7px 12px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--verde-osc);box-shadow:0 1px 3px rgba(40,53,47,.14)}

/* kpi */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px 16px;box-shadow:var(--sh)}
.kpi b{display:block;font-family:var(--mono);font-size:24px;font-weight:600;letter-spacing:-.035em;margin-top:6px}
.kpi small{display:block;font-size:12px;color:var(--gris);margin-top:2px}
.kpi.ok{background:var(--verde-cl);border-color:var(--verde-b);border-left:4px solid var(--verde)} .kpi.ok b{color:var(--verde-osc)}
.kpi.warn{background:var(--naranja-cl);border-color:#e6bf9c;border-left:4px solid var(--naranja)} .kpi.warn b{color:#8c4a1c}
.kpi.bad{background:var(--rojo-cl);border-color:#e5b8b1;border-left:4px solid var(--rojo)} .kpi.bad b{color:#82322a}
.kpi.dark{background:var(--verde-osc);border-color:var(--verde-osc)} .kpi.dark .lbl,.kpi.dark small{color:rgba(255,255,255,.8)} .kpi.dark b{color:#fff}
.up{color:var(--rojo);font-weight:600} .down{color:var(--verde-osc);font-weight:600}

/* cards / grid */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
.card h2{font-family:var(--disp);font-size:14.5px;font-weight:600;margin-bottom:13px;display:flex;align-items:center;gap:10px}
.card h2 .r{margin-left:auto;font-family:var(--sans);font-size:12px;font-weight:500;color:var(--gris)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.g2>.card{margin-bottom:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.grid .full{grid-column:1/-1}
h3.sec{font-family:var(--disp);font-size:12px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--gris2);
  background:#dde7e2;border-radius:9px;padding:10px 16px;margin:24px 0 12px;display:flex;align-items:center;gap:10px}
h3.sec:first-child{margin-top:0}
h3.sec span{font-family:var(--mono);background:rgba(255,255,255,.8);border-radius:999px;padding:2px 9px}

/* forms */
label{display:block} label .lbl{display:block;margin-bottom:4px}
input,select,textarea{width:100%;font-family:var(--sans);font-size:13.5px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--tinta)}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--verde);outline:none}
input.num{font-family:var(--mono)}
input[readonly]{background:var(--line2)}
.btn{font-family:var(--sans);font-size:13.5px;font-weight:600;padding:10px 20px;border-radius:9px;border:1px solid var(--verde);
  background:var(--verde);color:#fff;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{background:var(--verde-osc);border-color:var(--verde-osc)}
.btn.ghost{background:#fff;color:var(--verde-osc)} .btn.ghost:hover{background:var(--verde-cl)}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn.danger{border-color:var(--line);background:#fff;color:var(--rojo)} .btn.danger:hover{background:var(--rojo-cl);border-color:var(--rojo)}
.row-actions{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row-actions .spacer{flex:1}

/* tablas */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#fff;padding:9px 10px;background:var(--verde-osc);white-space:nowrap}
th:first-child{border-radius:8px 0 0 0} th:last-child{border-radius:0 8px 0 0}
td{padding:7px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
tbody tr:nth-child(even) td{background:#f7faf8}
tbody tr.clk{cursor:pointer} tbody tr.clk:hover td{background:var(--verde-cl)}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.sum td{font-weight:700;background:var(--line2)!important;border-top:2px solid var(--verde-b)}
td .det{display:block;font-size:11.5px;color:var(--gris);margin-top:1px}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--line2);color:var(--gris2);white-space:nowrap}
.tag.COR{background:var(--rojo-cl);color:var(--rojo)} .tag.PRE{background:var(--verde-cl);color:var(--verde-osc)}
.tag.MEJ{background:var(--azul-cl);color:var(--azul)} .tag.PRY{background:#f1ecf8;color:#6b4fa0}
.tag.warn{background:var(--naranja-cl);color:#9c5420}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:7px;vertical-align:0}

/* barras horizontales */
.hb{display:grid;grid-template-columns:minmax(110px,190px) 1fr auto;gap:6px 12px;align-items:center;font-size:12.5px}
.hb .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--gris2)}
.hb .t.clk{cursor:pointer} .hb .t.clk:hover{color:var(--verde-osc);text-decoration:underline}
.hb .b{height:14px;background:var(--line2);border-radius:4px;overflow:hidden}
.hb .b i{display:block;height:100%;border-radius:4px;background:var(--verde)}
.hb .v{font-family:var(--mono);font-size:12px;text-align:right;white-space:nowrap}
.hb .v small{color:var(--gris);margin-left:6px}
svg text{font-family:var(--sans)}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:var(--gris2);margin-top:8px}

/* proyectos */
.board{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:#dde7e2;border-radius:12px;padding:10px;min-height:120px}
.col>h4{font-family:var(--disp);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gris2);margin:2px 4px 10px;display:flex;justify-content:space-between}
.pc{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--verde);border-radius:6px 11px 11px 6px;padding:11px 12px;margin-bottom:9px;cursor:pointer;box-shadow:0 1px 3px rgba(40,53,47,.07)}
.pc:hover{border-color:var(--verde-b)}
.pc.P1{border-left-color:var(--rojo)} .pc.P2{border-left-color:var(--naranja)} .pc.P3{border-left-color:var(--verde)}
.pc b{font-family:var(--disp);font-size:13.5px;display:block;line-height:1.3}
.pc .m{font-size:11.5px;color:var(--gris);margin-top:3px}
.prog{height:7px;background:var(--line2);border-radius:99px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--verde);border-radius:99px}
.prog.over i{background:var(--rojo)}
.pc .r2{display:flex;justify-content:space-between;font-size:11px;color:var(--gris2);margin-top:5px;font-family:var(--mono)}
.ptop{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.ptop h1{font-family:var(--disp);font-size:22px;letter-spacing:-.02em;line-height:1.2}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.subtabs button{border:0;background:transparent;font-family:var(--sans);font-size:13px;font-weight:600;color:var(--gris);padding:10px 14px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.subtabs button[aria-selected="true"]{color:var(--verde-osc);border-bottom-color:var(--verde-osc)}
.etapa{border:1px solid var(--line);border-radius:11px;margin-bottom:10px;overflow:hidden}
.etapa-h{display:flex;gap:12px;align-items:center;padding:11px 14px;background:#fafcfb;flex-wrap:wrap}
.etapa-h b{font-family:var(--disp);font-size:14px}
.etapa-b{padding:10px 14px;border-top:1px solid var(--line2)}
.chk{display:flex;gap:10px;align-items:center;padding:5px 0;font-size:13px}
.chk input{width:18px;height:18px;flex:none;accent-color:var(--verde)}
.chk.ok span{text-decoration:line-through;color:var(--gris)}
.chk .x{margin-left:auto;border:0;background:none;color:var(--gris);cursor:pointer;font-size:16px}
.chk .x:hover{color:var(--rojo)}
.addrow{display:flex;gap:8px;margin-top:8px} .addrow input{flex:1}
.bit{border-left:3px solid var(--verde-b);padding:6px 0 6px 14px;margin-bottom:8px}
.bit .mini b{color:var(--gris2)}
.est{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 10px;border-radius:999px}
.est.IDE,.est.EVA{background:var(--line2);color:var(--gris2)} .est.APR{background:var(--azul-cl);color:var(--azul)}
.est.EJE{background:var(--naranja-cl);color:#9c5420} .est.PEM{background:#f1ecf8;color:#6b4fa0}
.est.CER{background:var(--verde-cl);color:var(--verde-osc)} .est.SUS{background:var(--rojo-cl);color:var(--rojo)}
.est.pend{background:var(--line2);color:var(--gris2)} .est.curso{background:var(--naranja-cl);color:#9c5420} .est.hecha{background:var(--verde-cl);color:var(--verde-osc)}

/* modal / login / toast */
.ovl{position:fixed;inset:0;background:rgba(21,37,29,.42);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto}
.ovl:empty{display:none}
.modal{position:relative;background:var(--panel);border-radius:16px;max-width:820px;width:100%;padding:22px;box-shadow:0 18px 50px rgba(21,37,29,.28)}
.modal.w{max-width:1000px}
.modal h2{font-family:var(--disp);font-size:17px;font-weight:600;margin-bottom:4px;padding-right:40px}
.modal .sub{font-size:12.5px;color:var(--gris);margin-bottom:16px}
.cerrar{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--gris2);font-size:19px;line-height:1;cursor:pointer}
.cerrar:hover{border-color:var(--rojo);color:var(--rojo);background:var(--rojo-cl)}
.login{position:fixed;inset:0;background:linear-gradient(160deg,#f3f7f4,#e2ede7);z-index:100;display:flex;align-items:center;justify-content:center;padding:22px}
.login.off{display:none}
.login-box{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:34px 30px;width:100%;max-width:390px;text-align:center;box-shadow:0 20px 50px rgba(21,45,33,.14)}
.login-box .mk{height:52px;margin-bottom:9px} .login-box .wm{height:26px;margin-bottom:20px}
.login-t{font-family:var(--disp);font-size:19px;font-weight:700}
.login-s{font-size:13px;color:var(--gris);margin:5px 0 18px}
#lg-in{font-family:var(--mono);font-size:26px;text-align:center;letter-spacing:.4em;padding:13px;border-radius:11px}
.login-err{color:var(--rojo);font-size:12.5px;height:17px;margin:8px 0 4px;font-weight:600}
.empty{text-align:center;color:var(--gris);padding:40px 18px;font-size:13.5px;background:var(--panel);border:1px dashed var(--line);border-radius:14px}
.empty b{display:block;color:var(--tinta);margin-bottom:6px;font-size:15px;font-family:var(--disp)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(90px);background:var(--tinta);color:#fff;padding:12px 22px;border-radius:999px;font-size:13px;font-weight:600;transition:transform .3s;z-index:90;box-shadow:0 8px 24px rgba(21,37,29,.26)}
.toast.show{transform:translateX(-50%) translateY(0)}
body.ro .solo-carga,body.ro .solo-admin{display:none!important}
body.carga .solo-admin{display:none!important}
.fab{display:none}
@media(max-width:760px){
  main,.nav-wrap{padding-left:12px;padding-right:12px} header{padding:10px 12px;gap:8px}
  .logo img.wm,#whoami,#btnCsv,#btnExp,#btnImp{display:none}
  .board{grid-template-columns:repeat(5,250px)} .g2{grid-template-columns:1fr}
  .hb{grid-template-columns:110px 1fr auto}
  .hide-m{display:none}
  header{flex-wrap:nowrap} header .sync{font-size:11px;padding:5px 9px;max-width:150px;overflow:hidden;white-space:nowrap}
  .kpis{grid-template-columns:1fr 1fr!important;gap:9px} .kpi{padding:11px 12px} .kpi b{font-size:18px}
  .fab{display:flex;position:fixed;right:16px;bottom:18px;width:58px;height:58px;border-radius:50%;background:var(--verde);color:#fff;font-size:30px;border:0;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(18,122,74,.4);z-index:40}
  body.ro .fab{display:none}
}
html.celu input,html.celu select,html.celu textarea{font-size:16px}
/* ================= ESTILO PET CHIVILCOY ================= */
:root{
  --verde:#16a34a; --verde-osc:#15803d; --verde-cl:#f0fdf4; --verde-b:#bbf7d0;
  --naranja:#d97706; --naranja-cl:#fef3c7; --rojo:#dc2626; --rojo-cl:#fee2e2; --azul:#1e40af; --azul-cl:#dbeafe;
  --tinta:#1f2937; --gris2:#4b5563; --bg:#f3f4f6; --panel:#fff; --line:#e5e7eb; --line2:#f9fafb; --gris:#6b7280;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; --disp:var(--sans); --mono:var(--sans);
  --sh:0 1px 3px rgba(0,0,0,.05);
}
body{font-family:var(--sans);background:var(--bg);color:var(--tinta);font-size:14px}
.num,td.n,th.n{font-family:var(--sans);font-variant-numeric:tabular-nums}
.lbl{font-size:12px;font-weight:500;letter-spacing:.3px;text-transform:uppercase;color:var(--gris)}
label .lbl{font-size:12px;text-transform:none;letter-spacing:0;color:var(--gris2);font-weight:500}
/* login */
.login{background:#eef1f6}
.login-box{border:0;border-radius:20px;padding:40px 36px;max-width:380px;box-shadow:0 12px 40px rgba(15,23,42,.10)}
.login-logo{width:220px;max-width:80%;height:auto;display:block;margin:0 auto 18px}
.login-t{font-family:var(--sans);font-size:20px;font-weight:700;color:var(--tinta)}
.login-s{font-size:14px;color:var(--gris);margin:4px 0 22px}
#lg-in{font-family:var(--sans);font-size:24px;letter-spacing:10px;padding:16px;border:1.5px solid #e5e7eb;border-radius:10px;background:#f8fafc;margin-bottom:6px}
#lg-in:focus{border-color:var(--verde);background:#fff}
#lg-go{padding:15px 20px;font-size:16px;border-radius:10px}
.login-err{color:var(--rojo)}
/* header */
header{background:#fff;border-bottom:1px solid #e5e7eb;padding:12px 24px;box-shadow:0 1px 3px rgba(0,0,0,.05);gap:12px}
.logo{gap:14px}
.logo img{height:38px;width:auto;display:block}
.logo h1{font-size:16px;color:#0f172a;font-weight:700;line-height:1.2}
.logo .hsub{font-size:12px;color:var(--gris)}
.logo .ver{background:var(--verde);color:#fff;padding:1px 6px;border-radius:3px;font-size:10px;margin-left:6px;font-weight:600}
header button{background:#f3f4f6;border:1px solid #e5e7eb;padding:6px 12px;border-radius:6px;font-size:13px;color:var(--tinta);font-weight:400}
header button:hover{background:#e5e7eb;color:var(--tinta);border-color:#e5e7eb}
.whoami{font-family:var(--sans);font-size:12px;color:#374151;font-weight:600;background:#f0fdf4;border:1px solid #86efac;padding:3px 10px;border-radius:12px}
.sync{font-size:12px;font-weight:400;padding:4px 10px;border-radius:12px}
.sync::before{display:none}
.sync.ok{background:#d1fae5;color:#065f46} .sync.wait{background:#fef3c7;color:#92400e} .sync.err{background:#fee2e2;color:#991b1b} .sync.off{background:#f3f4f6;color:var(--gris)}
.aviso{background:#fef3c7;border:1px solid #fcd34d;color:#92400e;border-radius:8px;max-width:1552px;width:calc(100% - 48px)}
/* tabs */
.nav-wrap{max-width:none;margin:0;padding:0 24px;background:#fff;border-bottom:1px solid #e5e7eb}
nav{background:none;border-radius:0;width:auto;gap:4px}
nav button{font-family:var(--sans);font-size:14px;font-weight:500;color:var(--gris);padding:12px 18px;margin:0;border-radius:0;border-bottom:2px solid transparent}
nav button:hover{color:var(--tinta)}
nav button[aria-selected="true"]{background:none;box-shadow:none;color:var(--verde);border-bottom-color:var(--verde)}
nav .pill{background:#fee2e2;color:#991b1b;font-family:var(--sans);font-weight:600}
main{padding:20px 24px;max-width:1600px}
/* paneles y KPIs */
.card{border:0;border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.05);margin-bottom:16px}
.card h2{font-family:var(--sans);font-size:16px;font-weight:700;color:#0f172a;margin-bottom:16px}
.card h2 .r{font-family:var(--sans);font-weight:400}
.kpis{gap:12px;margin-bottom:20px}
.kpi{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:16px;box-shadow:none}
.kpi .lbl::before{display:none}
.kpi b{font-family:var(--sans);font-size:24px;font-weight:700;letter-spacing:0;color:#0f172a;margin-top:4px}
.kpi small{font-size:11px;color:#9ca3af}
.kpi.dark{background:#fff;border-color:#e5e7eb;border-left:4px solid var(--verde)} .kpi.dark .lbl{color:var(--gris)} .kpi.dark small{color:#9ca3af} .kpi.dark b{color:var(--verde-osc)}
.kpi.ok{background:#fff;border-color:#e5e7eb;border-left:1px solid #e5e7eb} .kpi.ok b{color:#059669}
.kpi.warn{background:#fff;border-color:#e5e7eb;border-left:1px solid #e5e7eb} .kpi.warn b{color:#d97706}
.kpi.bad{background:#fff;border-color:#e5e7eb;border-left:1px solid #e5e7eb} .kpi.bad b{color:#dc2626}
.up{color:#dc2626} .down{color:#059669}
h3.sec{font-family:var(--sans);font-size:13px;letter-spacing:.3px;color:#374151;background:#e5e7eb;border-radius:8px}
/* tablas */
th{background:#f9fafb;color:#374151;font-size:12px;font-weight:600;letter-spacing:.3px;padding:10px 8px;border-bottom:2px solid #e5e7eb}
th:first-child,th:last-child{border-radius:0}
td{padding:8px;border-bottom:1px solid #f3f4f6}
tbody tr:nth-child(even) td{background:none}
tbody tr.clk:hover td,tbody tr:hover td{background:#f9fafb}
tr.sum td{background:#f9fafb!important;border-top:2px solid #e5e7eb}
/* forms y botones */
input,select,textarea{font-family:var(--sans);font-size:14px;padding:9px 11px;border:1px solid #d1d5db;border-radius:6px;background:#fff}
input:focus,select:focus,textarea:focus{border-color:var(--verde)}
input[readonly]{background:#f9fafb}
.btn{font-family:var(--sans);font-size:13px;font-weight:500;padding:8px 14px;border-radius:6px;border:1px solid transparent;background:var(--verde);color:#fff}
.btn:hover{background:var(--verde-osc);border-color:transparent}
.btn.ghost{background:#fff;color:#374151;border-color:#d1d5db} .btn.ghost:hover{background:#f9fafb}
.btn.danger{background:#dc2626;color:#fff;border-color:#dc2626} .btn.danger:hover{background:#b91c1c}
.btn.sm{padding:5px 10px;font-size:12px}
.tbtn{font-family:var(--sans);background:#f3f4f6;border:1px solid #e5e7eb;border-radius:6px;color:var(--tinta)}
.seg{background:#f3f4f6;border:1px solid #e5e7eb;border-radius:8px}
.seg button{font-family:var(--sans);font-weight:500;border-radius:6px}
.seg button[aria-pressed="true"]{background:var(--verde);color:#fff;box-shadow:none}
/* modal */
.ovl{background:rgba(0,0,0,.5)}
.modal{border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.modal h2{font-family:var(--sans);font-size:17px;font-weight:700}
/* chips de estado (paleta Tailwind de PET) */
.tag,.est{border-radius:10px;font-size:11px;font-weight:600;letter-spacing:0;text-transform:none;padding:2px 8px}
.tag.COR{background:#fee2e2;color:#991b1b} .tag.PRE{background:#d1fae5;color:#065f46} .tag.MEJ{background:#dbeafe;color:#1e40af} .tag.PRY{background:#ddd6fe;color:#5b21b6}
.tag.warn{background:#fef3c7;color:#92400e}
.est.IDE,.est.EVA,.est.pend{background:#f3f4f6;color:#4b5563;border:1px solid #d1d5db}
.est.APR{background:#dbeafe;color:#1e40af;border:1px solid #93c5fd} .est.EJE,.est.curso{background:#fef3c7;color:#92400e}
.est.PEM{background:#ffedd5;color:#9a3412;border:1px solid #fdba74} .est.CER,.est.hecha{background:#dcfce7;color:#15803d;border:1px solid #86efac}
.est.SUS{background:#fee2e2;color:#991b1b}
/* proyectos */
.col{background:#e5e7eb;border-radius:10px}
.col>h4{font-family:var(--sans);color:#374151}
.pc{border:1px solid #e5e7eb;border-left:4px solid var(--verde);border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.pc b{font-family:var(--sans)}
.pc.P1{border-left-color:#dc2626} .pc.P2{border-left-color:#d97706} .pc.P3{border-left-color:#16a34a}
.pc .r2{font-family:var(--sans)}
.ptop h1{font-family:var(--sans);font-size:20px;color:#0f172a}
.subtabs button{font-family:var(--sans);font-weight:500;border-bottom-width:2px}
.subtabs button[aria-selected="true"]{color:var(--verde);border-bottom-color:var(--verde)}
.etapa{border-radius:10px} .etapa-h b{font-family:var(--sans)} .etapa-h{background:#f9fafb}
.hb .v{font-family:var(--sans)} .prog i{background:var(--verde)}
.toast{left:auto;right:20px;bottom:20px;transform:translateY(120px);border-radius:8px;background:#1f2937;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.toast.show{transform:translateY(0)}


/* cronograma de preventivos */
table.crono{font-size:12px;border-collapse:separate;border-spacing:0}
table.crono th.cc{text-align:center;font-size:10px;padding:8px 2px;min-width:38px;letter-spacing:0}
table.crono th.cn,table.crono td.cn{position:sticky;left:0;background:#fff;z-index:1;min-width:220px;max-width:260px;white-space:normal;border-right:1px solid #e5e7eb}
table.crono thead th.cn{background:#f9fafb}
table.crono td.cc{text-align:center;padding:6px 2px;border-left:1px solid #f3f4f6;white-space:nowrap}
table.crono .hoy{background:#f0fdf4!important}
table.crono tr.cs td{background:#f3f4f6!important;font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;color:#374151;padding:7px 10px;position:sticky;left:0}
i.cm{display:inline-block;width:14px;height:14px;border-radius:50%;margin:1px;vertical-align:middle;cursor:pointer;border:2px solid transparent}
i.cm.hecho{background:#16a34a} i.cm.tarde{background:#d97706} i.cm.prog{background:#fff;border-color:#16a34a}
i.cm.ot{background:#dbeafe;border-color:#1e40af} i.cm.venc{background:#dc2626}
.leg i.cm{cursor:default;margin-right:5px}
.filtros .lbl{text-transform:none;letter-spacing:0;color:var(--gris2);font-weight:500}
@media(max-width:760px){header{padding:10px 12px}.logo img{height:30px}.logo h1{font-size:14px}.logo .hsub{display:none}.nav-wrap{padding:0 8px}nav button{padding:11px 12px}}

@media print{header,nav,.nav-wrap,.filtros,.fab,.row-actions,.aviso{display:none!important} body{background:#fff}}
</style>

/* ---------------- utilidades ---------------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).slice(2,6).toUpperCase();
const AHORA=()=>Date.now();
const HOY=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10);};
const f0=n=>(n==null||isNaN(n))?'—':Math.round(n).toLocaleString('es-AR');
const f2=n=>(n==null||isNaN(n))?'—':Number(n).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fARS=n=>'$ '+f0(n);
const fUSD=n=>(n==null||isNaN(n))?'—':'U$D '+f0(n);
const fK=n=>{const a=Math.abs(n);return a>=1e6?(n/1e6).toLocaleString('es-AR',{maximumFractionDigits:1})+' M':a>=1e4?(n/1e3).toLocaleString('es-AR',{maximumFractionDigits:0})+' k':f0(n);};
const fFec=s=>s?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(2,4):'—';
const mesTxt=k=>MESES[+k.slice(5,7)-1]+' '+k.slice(2,4);
const pnum=v=>{if(v==null)return NaN;v=String(v).trim().replace(/\s|\$/g,'');if(/,\d{1,2}$/.test(v)||/\.\d{3}/.test(v))v=v.replace(/\./g,'').replace(',','.');return parseFloat(v);};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._i);t._i=setTimeout(()=>t.classList.remove('show'),2400);}

/* ---------------- tipo de cambio (oficial BNA venta) ---------------- */
let TCA=[];  /* [[fecha,venta],...] ordenado */
function cargarTCcache(){try{const c=JSON.parse(localStorage.getItem('wf_tc_oficial')||'null');if(c&&c.a)TCA=c.a;return c;}catch(e){return null;}}
async function bajarTC(){
  const c=cargarTCcache();
  if(c&&c.t&&(AHORA()-c.t)<6*3600e3) return;
  try{
    const r=await fetch('https://api.argentinadatos.com/v1/cotizaciones/dolares/oficial',{cache:'no-store'});
    if(!r.ok) throw 0;

function filtrarGastos(){
  const q=FG.q.trim().toLowerCase();
  return D.gastos.filter(g=>(!FG.anio||g.fec.startsWith(FG.anio))&&(!FG.mes||g.fec.slice(5,7)===FG.mes)&&(!FG.sec||g.sec===FG.sec)&&
    (!FG.eq||g.eq===FG.eq)&&(!FG.prov||provNorm(g.prov)===FG.prov)&&(!FG.tipo||(FG.tipo==='-'?!g.tipo:g.tipo===FG.tipo))&&
    (!FG.cat||(g.cat||'OTR')===FG.cat)&&(!FG.pago||(FG.pago==='-'?!g.pago:g.pago===FG.pago))&&(!FG.proy||g.proy===FG.proy)&&(!FG.pl||g.pl===FG.pl)&&
    (!q||[g.desc,g.det,g.prov,g.comp,eqNom(g),g.maq].join(' ').toLowerCase().includes(q)))
    .sort((a,b)=>a.fec===b.fec?(b.ts||0)-(a.ts||0):(a.fec<b.fec?1:-1));
}
function opts(obj,sel,vacio){return (vacio!=null?`<option value="">${vacio}</option>`:'')+Object.entries(obj).map(([k,v])=>`<option value="${esc(k)}"${k===sel?' selected':''}>${esc(v)}</option>`).join('');}
function rGastos(){
  const el=$('#v-gas'); const anios=[...new Set(D.gastos.map(g=>g.fec.slice(0,4)))].sort().reverse();
  const eqs={};D.equipos.slice().sort((a,b)=>a.nom.localeCompare(b.nom)).forEach(e=>eqs[e.id]=e.nom);
  const prs={};proveedores().forEach(p=>prs[provNorm(p)]=p);
  const pys={};D.proyectos.forEach(p=>pys[p.id]=p.nom);
  el.innerHTML=`<div class="card" style="padding:14px 16px">
    <div class="filtros" style="margin:0">
      <label class="grow"><span class="lbl">Buscar</span><input id="fq" placeholder="descripción, proveedor, factura, equipo…" value="${esc(FG.q)}"></label>
      <label><span class="lbl">Año</span><select id="fanio">${opts(Object.fromEntries(anios.map(a=>[a,a])),FG.anio,'Todos')}</select></label>
      <label><span class="lbl">Mes</span><select id="fmes">${opts(Object.fromEntries(MESES.map((m,i)=>[String(i+1).padStart(2,'0'),m])),FG.mes,'Todos')}</select></label>
      <label><span class="lbl">Planta</span><select id="fpl">${opts(PLANTAS,FG.pl,'Todas')}</select></label>
      <label><span class="lbl">Sector</span><select id="fsec">${opts(SECTORES,FG.sec,'Todos')}</select></label>
      <label><span class="lbl">Equipo</span><select id="feq">${opts(eqs,FG.eq,'Todos')}</select></label>
      <label><span class="lbl">Proveedor</span><select id="fprov">${opts(prs,FG.prov,'Todos')}</select></label>
      <label><span class="lbl">Tipo</span><select id="ftipo">${opts({...TIPOS,'-':'Sin clasificar'},FG.tipo,'Todos')}</select></label>
      <label><span class="lbl">Categoría</span><select id="fcat">${opts(CATS,FG.cat,'Todas')}</select></label>
      <label><span class="lbl">B / N</span><select id="fpago">${opts({...PAGOS,'-':'Sin dato'},FG.pago,'Todos')}</select></label>
      ${D.proyectos.length?`<label><span class="lbl">Proyecto</span><select id="fproy">${opts(pys,FG.proy,'Todos')}</select></label>`:''}
      <button class="tbtn" id="flimpiar">Limpiar</button>
      <button class="btn solo-carga" id="gnuevo">+ Cargar gasto</button>
    </div></div><div id="glist"></div>`;
  const bind=(id,k,ev)=>{const x=$('#'+id);if(x)x.addEventListener(ev||'change',e=>{FG[k]=e.target.value;FG.lim=200;lista();});};
  bind('fanio','anio');bind('fmes','mes');bind('fpl','pl');bind('fsec','sec');bind('feq','eq');bind('fprov','prov');bind('ftipo','tipo');bind('fcat','cat');bind('fpago','pago');bind('fproy','proy');
  let tq;$('#fq').oninput=e=>{clearTimeout(tq);tq=setTimeout(()=>{FG.q=e.target.value;FG.lim=200;lista();},200);};
  $('#flimpiar').onclick=()=>irGastos({});
  const gn=$('#gnuevo');if(gn)gn.onclick=()=>formGasto();
  lista();
}
function lista(){
  const gs=filtrarGastos(); const el=$('#glist');
  const tA=gs.reduce((a,g)=>a+(g.ars||0),0), tU=gs.reduce((a,g)=>a+(usdDe(g)||0),0);
  if(!gs.length){el.innerHTML='<div class="empty"><b>No hay gastos con esos filtros</b>Probá limpiar los filtros o cargá uno nuevo.</div>';return;}
  const v=gs.slice(0,FG.lim);
  el.innerHTML=`<div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">
     <div class="kpi"><span class="lbl">Gastos</span><b>${gs.length}</b></div>

     ${splitBN(gs)}</div>

    <tbody>${v.map(g=>{const inc=incompleto(g).length&&!g.ok;const p=g.proy&&pryDe(g.proy);return `<tr class="clk" data-g="${g.id}">
      <td class="num" style="white-space:nowrap">${fFec(g.fec)}${g.pl==='C'?'<span class="det">Chivilcoy</span>':''}</td>
      <td><i class="dot" style="background:${SEC_COL[g.sec]||'#ccc'}"></i>${esc(eqNom(g)||'—')}<span class="det">${esc(SECTORES[g.sec]||'')}</span></td>
      <td>${esc(g.desc||'—')}${inc?' <span class="tag warn">revisar</span>':''}${g.det?`<span class="det">${esc(g.det)}</span>`:''}${p?`<span class="det">▸ ${esc(p.nom)}</span>`:''}</td>
      <td class="hide-m">${esc(g.prov||'—')}${g.comp?`<span class="det">${esc(g.comp)}</span>`:''}</td>
      <td class="hide-m">${g.tipo?`<span class="tag ${g.tipo}">${TIPOS[g.tipo]}</span>`:''}${g.cat?`<span class="det">${esc(CATS[g.cat]||'')}</span>`:''}</td>
      <td class="n">${fARS(g.ars)}<span class="det">${g.pago?`<b style="color:${PAGO_COL[g.pago]}">${esc(g.pago)}</b> ${pagoTxt(g.pago).toLowerCase()}`:''}</span></td><td class="n hide-m">${f0(usdDe(g))}</td></tr>`;}).join('')}
    <tr class="sum"><td colspan="5" class="hide-m">Total (${gs.length})</td><td class="n">${fARS(tA)}</td><td class="n hide-m">${f0(tU)}</td></tr></tbody></table></div></div>
  ${gs.length>FG.lim?`<div style="text-align:center"><button class="btn ghost" id="gmas">Ver ${Math.min(200,gs.length-FG.lim)} más (${gs.length-FG.lim} restantes)</button></div>`:''}`;
  el.querySelectorAll('[data-g]').forEach(r=>r.onclick=()=>formGasto(r.dataset.g));
  const m=$('#gmas');if(m)m.onclick=()=>{FG.lim+=200;lista();};

}

function bitAuto(p,t){p.bit=p.bit||[];p.bit.push({id:uid(),fec:HOY(),u:USER?USER.n:'',t,auto:1});}

function gantt(p){
  const et=(p.etapas||[]).filter(e=>e.fi&&e.ff); if(!et.length) return '<p class="mini">Cargá fechas de inicio y fin en las etapas para ver el cronograma.</p>';
  const ini=[p.fi,...et.map(e=>e.fi)].filter(Boolean).sort()[0], fin=[p.ff,...et.map(e=>e.ff)].filter(Boolean).sort().pop();
  const a=new Date(ini),b=new Date(fin);const dias=Math.max(1,(b-a)/864e5);
  const W=960,L=200,rh=30,H=et.length*rh+34;const x=f=>L+(W-L-10)*((new Date(f)-a)/864e5)/dias;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Cronograma">`;
  /* marcas de mes */
  let m=new Date(ini.slice(0,7)+'-01T12:00');while(m<=b){const f=m.toISOString().slice(0,10);if(f>=ini){s+=`<line x1="${x(f)}" x2="${x(f)}" y1="18" y2="${H}" stroke="#e5ebe8"/><text x="${x(f)+3}" y="12" font-size="10.5" fill="#7b8b83">${mesTxt(f)}</text>`;}m.setMonth(m.getMonth()+1);}
  et.forEach((e,i)=>{const y=24+i*rh;const c=e.est==='hecha'?'#1f9d63':e.est==='curso'?'#d9793a':'#9fb3a9';
    const late=e.ff<HOY()&&e.est!=='hecha';
    s+=`<text x="4" y="${y+15}" font-size="12" fill="#28352f">${esc(e.nom.length>28?e.nom.slice(0,27)+'…':e.nom)}</text>
      <rect x="${x(e.fi)}" y="${y+3}" width="${Math.max(4,x(e.ff)-x(e.fi))}" height="18" rx="5" fill="${c}" ${late?'stroke="#b4574c" stroke-width="2"':''}><title>${esc(e.nom)}: ${fFec(e.fi)} → ${fFec(e.ff)} · ${ESTE[e.est||'pend']}</title></rect>`;});
  const h=HOY();if(h>=ini&&h<=fin)s+=`<line x1="${x(h)}" x2="${x(h)}" y1="16" y2="${H}" stroke="#b4574c" stroke-width="2"/><text x="${x(h)+4}" y="${H-4}" font-size="10.5" fill="#b4574c">hoy</text>`;
  return s+'</svg>';
}

    if(!p.fi||(r.fi&&r.fi<p.fi))p.fi=r.fi||p.fi; if(!p.ff||(r.ff&&r.ff>p.ff))p.ff=r.ff||p.ff;

/* =====================================================================
   PREVENTIVOS
   Planes (qué se hace, cada cuánto, en qué equipo) -> ocurrencias
   programadas (se calculan solas) -> trabajos (lo que realmente se hizo:
   quién, horas, repuestos, costo). El historial es la lista de trabajos.
   ===================================================================== */
const FREC_U={d:'días',s:'semanas',m:'meses'};
const EST_T={prog:'Programado',curso:'En curso',hecho:'Realizado',cancel:'Cancelado'};
let PV_TAB='prox', PV_ESC='sem', PV_FEQ='', PV_FSEC='';
function sumarFrec(f,n,u){const d=new Date(f+'T12:00');if(u==='d')d.setDate(d.getDate()+n);else if(u==='s')d.setDate(d.getDate()+7*n);else d.setMonth(d.getMonth()+n);return d.toISOString().slice(0,10);}
const frecTxt=p=>p.fn?('cada '+(p.fn===1?{d:'día',s:'semana',m:'mes'}[p.fu]:p.fn+' '+FREC_U[p.fu])):'—';
const planDe=id=>D.planes.find(p=>p.id===id);
const trabDe=id=>D.trabajos.find(t=>t.id===id);
const eqTxt=x=>{const e=x.eq&&eqDe(x.eq);return e?e.nom:(SECTORES[x.sec]||'—');};
function ultimoHecho(p){let u='';D.trabajos.forEach(t=>{if(t.plan===p.id&&t.est==='hecho'&&t.fec>u)u=t.fec;});return u;}
function abiertoDe(p){return D.trabajos.filter(t=>t.plan===p.id&&(t.est==='prog'||t.est==='curso')).sort((a,b)=>a.fprog<b.fprog?-1:1)[0];}
function proxDe(p){const ab=abiertoDe(p);if(ab)return ab.fprog;const u=ultimoHecho(p);return u?sumarFrec(u,p.fn||1,p.fu||'m'):(p.fini||HOY());}
function estadoPlan(p){if(p.inact)return['off','Inactivo'];const x=proxDe(p),h=HOY();if(x<h)return['venc','Vencido'];if(x<=sumarFrec(h,7,'d'))return['prox','Esta semana'];return['ok','Al día'];}
/* ocurrencias programadas entre dos fechas (virtuales, no se guardan) */
function ocurrencias(p,desde,hasta){
  if(p.inact||!p.fn) return [];
  const out=[];let d=proxDe(p),n=0;
  while(d<=hasta&&n<400){if(d>=desde||d<HOY())out.push(d);d=sumarFrec(d,p.fn,p.fu);n++;}
  return out.filter(x=>x>=desde||x===proxDe(p));
}
function costoT(t){const r=(t.rep||[]).reduce((a,x)=>a+(x.cant||0)*(x.cu||0),0);return {rep:r,ext:t.ext||0,tot:r+(t.ext||0)};}
const usdT=t=>{const c=costoT(t).tot,tc=tcDia(t.fec||t.fprog);return tc&&c?c/tc:0;};

function rPrev(){
  const el=$('#v-prev');const h=HOY();
  const planes=D.planes.filter(p=>!p.inact);
  const venc=planes.filter(p=>proxDe(p)<h), sem=planes.filter(p=>{const x=proxDe(p);return x>=h&&x<=sumarFrec(h,7,'d');});
  const y=h.slice(0,4);const hechosA=D.trabajos.filter(t=>t.est==='hecho'&&t.fec&&t.fec.startsWith(y));
  const aTiempo=hechosA.filter(t=>!t.fprog||t.fec<=sumarFrec(t.fprog,3,'d')).length;
  const hh=hechosA.reduce((a,t)=>a+(t.hh||0),0), cos=hechosA.reduce((a,t)=>a+costoT(t).tot,0);
  const tabs={prox:'Próximos y vencidos',crono:'Cronograma',planes:'Planes ('+planes.length+')',hist:'Historial'};
  el.innerHTML=`<div class="filtros"><div class="spacer" style="flex:1"></div>
    <button class="btn ghost solo-carga" id="pv-tnuevo">+ Trabajo puntual</button><button class="btn solo-carga" id="pv-pnuevo">+ Nuevo plan preventivo</button></div>
  <div class="kpis">
    <div class="kpi ${venc.length?'bad':'ok'}"><span class="lbl">Vencidos</span><b>${venc.length}</b><small>preventivos con fecha pasada</small></div>
    <div class="kpi ${sem.length?'warn':''}"><span class="lbl">Próximos 7 días</span><b>${sem.length}</b><small>a programar esta semana</small></div>
    <div class="kpi dark"><span class="lbl">Realizados ${y}</span><b>${hechosA.length}</b><small>${hechosA.length?Math.round(aTiempo/hechosA.length*100)+'% a tiempo':'—'}</small></div>
    <div class="kpi"><span class="lbl">Horas hombre ${y}</span><b>${f0(hh)}</b><small>en preventivos realizados</small></div>
    <div class="kpi"><span class="lbl">Costo preventivos ${y}</span><b>${fARS(cos)}</b><small>repuestos + servicios externos</small></div>
  </div>
  <div class="subtabs">${Object.entries(tabs).map(([k,t])=>`<button data-pvt="${k}" aria-selected="${k===PV_TAB}">${t}</button>`).join('')}</div>
  <div id="pv-body"></div>`;
  el.querySelectorAll('[data-pvt]').forEach(b=>b.onclick=()=>{PV_TAB=b.dataset.pvt;rPrev();});
  const pn=$('#pv-pnuevo');if(pn)pn.onclick=()=>formPlan();
  const tn=$('#pv-tnuevo');if(tn)tn.onclick=()=>formTrabajo(null,{});
  ({prox:pvProx,crono:pvCrono,planes:pvPlanes,hist:pvHist})[PV_TAB]($('#pv-body'));
}
function pvProx(el){
  const h=HOY(),lim=sumarFrec(h,30,'d');
  const abiertos=D.trabajos.filter(t=>t.est==='prog'||t.est==='curso');
  const filas=[];
  D.planes.filter(p=>!p.inact).forEach(p=>{const x=proxDe(p);if(x<=lim){const ab=abiertoDe(p);filas.push({p,f:x,t:ab});}});
  abiertos.filter(t=>!t.plan).forEach(t=>filas.push({p:null,f:t.fprog,t}));
  filas.sort((a,b)=>a.f<b.f?-1:1);
  if(!filas.length){el.innerHTML=`<div class="empty"><b>No hay preventivos en los próximos 30 días</b>${D.planes.length?'Todo al día.':'Cargá el primer plan preventivo: equipo, tareas y cada cuánto se hace.'}</div>`;return;}
  el.innerHTML=`<div class="card" style="padding:0;overflow:hidden"><div class="tw"><table><thead><tr><th>Fecha</th><th>Preventivo</th><th>Equipo</th><th class="hide-m">Frecuencia</th><th class="hide-m">Responsable</th><th>Estado</th><th></th></tr></thead><tbody>
  ${filas.map(({p,f,t})=>{const v=f<h;const st=t?t.est:'pend';return `<tr><td class="num" style="white-space:nowrap;${v?'color:var(--rojo);font-weight:600':''}">${fFec(f)}${v?'<span class="det">vencido '+Math.round((new Date(h)-new Date(f))/864e5)+' d</span>':''}</td>
    <td><b>${esc(p?p.nom:t.nom)}</b>${p&&p.dur?`<span class="det">${f2(p.dur)} h estimadas${p.parada?' · requiere parada':''}</span>`:''}</td><td>${esc(eqTxt(p||t))}</td>
    <td class="hide-m">${p?frecTxt(p):'puntual'}</td><td class="hide-m">${esc((t&&t.quien)||(p&&p.resp)||'—')}</td>
    <td>${t?`<span class="est ${t.est==='curso'?'EJE':'APR'}">${EST_T[t.est]}</span>`:(v?'<span class="est SUS">Vencido</span>':'<span class="est pend">Pendiente</span>')}</td>
    <td style="text-align:right;white-space:nowrap">${puede()?(t?`<button class="btn sm" data-tab="${t.id}">${t.est==='curso'?'Completar':'Abrir'}</button>`:`<button class="btn sm ghost" data-gen="${p.id}|${f}">Generar OT</button> <button class="btn sm" data-reg="${p.id}|${f}">Registrar hecho</button>`):''}</td></tr>`;}).join('')}
  </tbody></table></div></div>
  <p class="mini">"Generar OT" deja el trabajo programado (para asignarlo y hacerlo después). "Registrar hecho" carga directamente lo que se hizo. La próxima fecha se recalcula desde la fecha en que se realizó.</p>`;
  el.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>formTrabajo(b.dataset.tab));
  el.querySelectorAll('[data-gen]').forEach(b=>b.onclick=()=>{const [pid,f]=b.dataset.gen.split('|');const t=nuevoTrabajo(planDe(pid),f,'prog');D.trabajos.push(t);save();toast('OT generada');formTrabajo(t.id);});
  el.querySelectorAll('[data-reg]').forEach(b=>b.onclick=()=>{const [pid,f]=b.dataset.reg.split('|');formTrabajo(null,{plan:pid,fprog:f,est:'hecho'});});
}
function nuevoTrabajo(p,f,est){
  return {id:'T'+uid(),ts:AHORA(),user:USER.n,plan:p?p.id:undefined,nom:p?p.nom:'',eq:p?p.eq:undefined,sec:p?p.sec:'',pl:p?p.pl:'L',
    fprog:f||HOY(),est:est||'prog',quien:p?p.resp:'',chk:(p&&p.tareas||[]).map(x=>({t:x,ok:false})),
    rep:(p&&p.rep||[]).map(x=>({d:x.d,cant:x.cant,cu:x.cu})),hh:p?p.dur:undefined};
}
function pvPlanes(el){
  const ps=D.planes.slice().sort((a,b)=>(a.inact?1:0)-(b.inact?1:0)||proxDe(a).localeCompare(proxDe(b)));
  if(!ps.length){el.innerHTML='<div class="empty"><b>Sin planes preventivos</b>Un plan define qué se hace, en qué equipo y cada cuánto (ej. "Cambio de aceite reductor Extrusora 3 — cada 6 meses").<br><br><button class="btn solo-carga" id="pv-p2">+ Crear el primero</button></div>';
    const b=$('#pv-p2');if(b)b.onclick=()=>formPlan();return;}
  el.innerHTML=`<div class="card" style="padding:0;overflow:hidden"><div class="tw"><table><thead><tr><th>Plan</th><th>Equipo</th><th>Frecuencia</th><th class="hide-m">Responsable</th><th class="hide-m">Último</th><th>Próximo</th><th>Estado</th></tr></thead><tbody>
  ${ps.map(p=>{const [c,t]=estadoPlan(p);return `<tr class="clk" data-pl="${p.id}"><td><b>${esc(p.nom)}</b><span class="det">${(p.tareas||[]).length} tareas${p.dur?' · '+f2(p.dur)+' h':''}${(p.rep||[]).length?' · '+p.rep.length+' repuestos':''}</span></td>
    <td>${esc(eqTxt(p))}</td><td>${frecTxt(p)}</td><td class="hide-m">${esc(p.resp||'—')}</td><td class="num hide-m">${fFec(ultimoHecho(p))}</td><td class="num">${p.inact?'—':fFec(proxDe(p))}</td>
    <td><span class="est ${{venc:'SUS',prox:'EJE',ok:'CER',off:'pend'}[c]}">${t}</span></td></tr>`;}).join('')}</tbody></table></div></div>`;
  el.querySelectorAll('[data-pl]').forEach(r=>r.onclick=()=>fichaPlan(r.dataset.pl));
}
function pvCrono(el){
  const h=HOY();
  /* columnas: semanas (4 atrás + 22 adelante) o meses (3 atrás + 12 adelante) */
  const cols=[];
  if(PV_ESC==='sem'){const d=new Date(h+'T12:00');d.setDate(d.getDate()-((d.getDay()+6)%7)-28);
    for(let i=0;i<26;i++){const a=d.toISOString().slice(0,10);d.setDate(d.getDate()+7);const b=sumarFrec(d.toISOString().slice(0,10),-1,'d');cols.push({a,b,t:a.slice(8,10)+'/'+a.slice(5,7),hoy:h>=a&&h<=b,mes:a.slice(5,7)});}}
  else{const d=new Date(h.slice(0,7)+'-01T12:00');d.setMonth(d.getMonth()-3);
    for(let i=0;i<15;i++){const a=d.toISOString().slice(0,10);d.setMonth(d.getMonth()+1);const b=sumarFrec(d.toISOString().slice(0,10),-1,'d');cols.push({a,b,t:mesTxt(a),hoy:h>=a&&h<=b});}}
  const desde=cols[0].a,hasta=cols[cols.length-1].b;
  const filas=D.planes.filter(p=>!p.inact&&(!PV_FEQ||p.eq===PV_FEQ)&&(!PV_FSEC||p.sec===PV_FSEC))
    .sort((a,b)=>(a.sec||'').localeCompare(b.sec||'')||eqTxt(a).localeCompare(eqTxt(b))||a.nom.localeCompare(b.nom));

      hp:pnum($('#tt-hp').value)||undefined,chk:chkTmp,rep:leerRep('ttr'),ext:pnum($('#tt-ext').value)||undefined,prov:$('#tt-prov').value.trim()||undefined,obs:$('#tt-obs').value.trim()||undefined,pago:$('#tt-pago').value||undefined};

    delete t._nuevo; Object.assign(t,r,{ts:AHORA()});
    if(!D.trabajos.includes(t))D.trabajos.push(t);
    /* gasto vinculado */
    let g=t.gid&&D.gastos.find(x=>x.id===t.gid);
    if(pasar){
      const tc=tcDia(t.fec);
      const datos={fec:t.fec,pl:t.pl||'L',sec:t.sec,eq:t.eq,desc:'Preventivo: '+t.nom,det:[(t.rep||[]).map(x=>(x.cant||1)+'× '+x.d).join(', '),t.obs].filter(Boolean).join(' — ')||undefined,
        tipo:'PRE',cat:t.ext&&!(t.rep||[]).length?'SRV':'INS',prov:t.prov||'',ars:Math.round(c*100)/100,pago:t.pago,hp:t.hp,resp:t.quien||USER.n,trab:t.id,tc:tc?Math.round(tc*100)/100:undefined,ts:AHORA()};

      Object.keys(g).forEach(k=>g[k]===undefined&&delete g[k]);
    }else if(g&&!$('#tt-gas').checked){D.gastos=D.gastos.filter(x=>x.id!==g.id);borrar(g.id);delete t.gid;}
    Object.keys(t).forEach(k=>t[k]===undefined&&delete t[k]);
    save();cerrarModal();toast(r.est==='hecho'?'Preventivo registrado'+(pasar?' y pasado a Gastos':''):'Trabajo guardado');
  };

    if(t.gid){D.gastos=D.gastos.filter(x=>x.id!==t.gid);borrar(t.gid);}D.trabajos=D.trabajos.filter(x=>x.id!==t.id);borrar(t.id);save();cerrarModal();};

    <td class="n">${f0(x.a)}</td><td class="n hide-m">${f0(x.t)}</td><td class="n hide-m">${x.n}</td><td class="n hide-m">${x.hp?f0(x.hp):'—'}</td><td class="num">${fFec(x.u)}</td></tr>`;}).join('')}</tbody></table></div></div>

function bajarArchivo(nom,txt,tipo){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:tipo}));a.download=nom;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);}
function exportar(){bajarArchivo('mantenimiento-respaldo-'+HOY()+'.json',JSON.stringify(D),'application/json');}
$('#btnSync').onclick=()=>{if(binId())sincronizar();else toast('Todavía no hay base en la nube');};
$('#btnExp').onclick=exportar; $('#btnImp').onclick=()=>$('#fileImp').click();
$('#fileImp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);
  if(!x.gastos)throw 0;D=fusionar(D,x);save();toast('Respaldo importado');}catch(err){alert('El archivo no es un respaldo válido.');}};r.readAsText(f);e.target.value='';};
$('#btnCsv').onclick=()=>{
  const gs=view==='gas'?filtrarGastos():D.gastos.slice().sort((a,b)=>a.fec<b.fec?1:-1);
  const c=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';const n=v=>v==null||isNaN(v)?'':String(Math.round(v*100)/100).replace('.',',');
  const rows=[['Fecha','Planta','Sector','Equipo','Descripción','Detalle','Tipo','Categoría','Proveedor','Comprobante','B/N','Importe $','TC','U$D','Horas parada','Proyecto','Responsable']]
   .concat(gs.map(g=>[g.fec,PLANTAS[g.pl]||'',SECTORES[g.sec]||'',eqNom(g),g.desc,g.det,TIPOS[g.tipo]||'',CATS[g.cat]||'',g.prov,g.comp,g.pago?g.pago+' '+pagoTxt(g.pago):'',n(g.ars),n(tcDe(g)),n(usdDe(g)),g.hp||'',(pryDe(g.proy)||{}).nom||'',g.resp]));
  bajarArchivo('mantenimiento-gastos-'+HOY()+'.csv','﻿'+rows.map(r=>r.map((v,i)=>[11,12,13].includes(i)?v:c(v)).join(';')).join('\r\n'),'text/csv;charset=utf-8');
};

iniciarDatos(); cargarTCcache(); window._loginPrev(); bajarTC();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
